name: AI Conflict Resolver (Ultimate)

on:
  pull_request:
    types: [synchronize, opened, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Conflict Resolution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Starting AI Conflict Resolution Process (Gemini)..."
          
          # 1. オープンなPRの一覧を取得 (GraphQL)
          # mergeable の計算を待たずに、とにかくチェックする
          QUERY='query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              pullRequests(states: OPEN, first: 30) {
                nodes {
                  number
                  headRefName
                  baseRefName
                }
              }
            }
          }'
          OWNER=$(echo $REPO | cut -d/ -f1)
          NAME=$(echo $REPO | cut -d/ -f2)
          PR_DATA=$(gh api graphql -f query="$QUERY" -f owner="$OWNER" -f repo="$NAME")
          
          echo "✅ PR Data received."
          
          # 2. 全てのPRに対してマージを試行し、コンフリクトがあればAIで解決
          echo "$PR_DATA" | jq -c '.data.repository.pullRequests.nodes[]' | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r '.number')
            HEAD=$(echo "$pr" | jq -r '.headRefName')
            BASE=$(echo "$pr" | jq -r '.baseRefName')
            
            # 自分自身のPRや既知のボット以外を対象にする（無限ループ防止）
            # ここではシンプルに全てのPRをチェック
            
            echo "----------------------------------------"
            echo "🔍 Checking PR #$PR_NO ($HEAD -> $BASE)..."
            
            git checkout "$HEAD"
            git config user.name "AI Conflict Resolver"
            git config user.email "ai-resolver@screeps.local"
            
            # main をマージしてみる
            git fetch origin "$BASE"
            if git merge "origin/$BASE" --no-edit; then
              echo "✅ Merge succeeded automatically. Updating branch..."
              git push origin "$HEAD" || echo "⚠️ Push skipped (already up to date)."
              continue
            fi
            
            echo "⚠️ Conflict detected in PR #$PR_NO. Invoking AI..."
            
            # コンフリクトしているファイルを取得
            FILES=$(git diff --name-only --diff-filter=U)
            for FILE in $FILES; do
              echo "🤖 AI resolving conflicts in $FILE..."
              CONTENT=$(cat "$FILE")
              
              # Gemini 1.5 Flash API 呼び出し
              # プロンプトを強化: 既存のコードを壊さないよう強調
              RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg content "$CONTENT" --arg file "$FILE" \
                  '{
                    contents: [{
                      parts: [{
                        text: ("You are a world-class senior developer. Resolve the merge conflicts in this JavaScript/TypeScript file.
                        Ensure the final code is syntactically correct and preserves the logic from both sides where appropriate.
                        Remove all conflict markers (<<<<<<<, =======, >>>>>>>).
                        Return ONLY the complete, resolved file content. Do not include markdown code blocks (```) or any preamble.
                        
                        File: " + $file + "\n\n" + $content)
                      }]
                    }],
                    generationConfig: {
                      temperature: 0.1,
                      topP: 0.95
                    }
                  }')")
              
              RESOLVED_CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
              
              if [ "$RESOLVED_CONTENT" != "null" ] && [ -n "$RESOLVED_CONTENT" ]; then
                # backticks を徹底的に削除
                CLEAN_CONTENT=$(echo "$RESOLVED_CONTENT" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```javascript/d' | sed '/^```js/d')
                echo "$CLEAN_CONTENT" > "$FILE"
                git add "$FILE"
                echo "✅ $FILE resolved by AI."
              else
                echo "❌ AI failed to resolve $FILE. Response: $RESPONSE"
                # 一部のファイルが失敗した場合はそのPRはスキップ
                git merge --abort
                continue 2
              fi
            done
            
            # 解決した内容をコミットしてプッシュ
            if git commit -m "chore: Auto-resolve merge conflicts via AI (Gemini 1.5)"; then
              git push origin "$HEAD"
              echo "🚀 Pushed AI-resolved changes for PR #$PR_NO"
            else
              echo "ℹ️ No changes to commit after resolution."
            fi
          done
