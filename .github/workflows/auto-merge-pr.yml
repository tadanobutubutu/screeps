name: Auto Merge PRs - Force Merge All

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # ループ防止: [skip ci] または Jules の PR はスキップ
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'google-labs-jules[bot]'

    steps:
      - name: Force Merge PR (No Conditions)
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prTitle = pr.title;
            console.log(`🚀 Force merging PR #${prNumber}: ${prTitle}`);

            async function tryMerge() {
              // First: try normal merge
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: prTitle,
                  commit_message: `Auto-merged PR #${prNumber}\n\n${(pr.body || '').slice(0, 500)}`,
                });
                console.log(`✅ SUCCESS: Merged PR #${prNumber}`);
                return true;
              } catch (e) {
                console.log(`⚠️ First merge attempt failed: ${e.message}`);
              }
              return false;
            }

            async function forceMergeWithAdmin() {
              // Try with admin privileges
              try {
                const mutation = `
                  mutation {
                    mergePullRequest(input: {
                      pullRequestId: "${pr.node_id}",
                      mergeMethod: SQUASH,
                      commitHeadline: "${prTitle.replace(/"/g, '\\"')}",
                    }) {
                      clientMutationId
                    }
                  }
                `;
                await github.graphql(mutation);
                console.log(`✅ SUCCESS: Force merged via GraphQL PR #${prNumber}`);
                return true;
              } catch (e) {
                console.log(`⚠️ GraphQL merge failed: ${e.message}`);
              }
              return false;
            }

            async function resolveConflictsAndMerge() {
              // Update branch first
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                console.log('Branch update triggered');
              } catch (e) {
                console.log(`Branch update error: ${e.message}`);
              }

              // Wait for branch update
              await new Promise(r => setTimeout(r, 8000));

              // Try merge again
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: prTitle,
                  commit_message: `Auto-merged PR #${prNumber}\n\n${(pr.body || '').slice(0, 500)}`,
                });
                console.log(`✅ SUCCESS: Merged after branch update PR #${prNumber}`);
                return true;
              } catch (e) {
                console.log(`Merge after update failed: ${e.message}`);
              }

              // Final try: use admin merge with expected head
              try {
                const mutation = `
                  mutation {
                    mergePullRequest(input: {
                      pullRequestId: "${pr.node_id}",
                      mergeMethod: SQUASH,
                      commitHeadline: "${prTitle.replace(/"/g, '\\"')}",
                    }) {
                      clientMutationId
                    }
                  }
                `;
                await github.graphql(mutation);
                console.log(`✅ SUCCESS: Final force merge PR #${prNumber}`);
                return true;
              } catch (e) {
                console.log(`Final force merge failed: ${e.message}`);
              }

              return false;
            }

            // Main execution
            let merged = await tryMerge();
            
            if (!merged) {
              // Wait a bit and retry
              await new Promise(r => setTimeout(r, 5000));
              merged = await tryMerge();
            }

            if (!merged) {
              // Try admin merge
              merged = await forceMergeWithAdmin();
            }

            if (!merged) {
              // Wait and try force merge with conflict resolution
              await new Promise(r => setTimeout(r, 3000));
              merged = await resolveConflictsAndMerge();
            }

            if (!merged) {
              // Ultimate fallback: use REST API with required status checks bypass
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: prTitle,
                  commit_message: `Auto-merged PR #${prNumber} (forced)\n\n${(pr.body || '').slice(0, 500)}`,
                });
                console.log(`✅ SUCCESS: Final merge attempt PR #${prNumber}`);
                merged = true;
              } catch (e) {
                console.log(`❌ ALL MERGE ATTEMPTS FAILED for PR #${prNumber}: ${e.message}`);
              }
            }

            // If still not merged, report failure but don't fail the workflow
            if (!merged) {
              console.log(`💥 Could not merge PR #${prNumber} after all attempts`);
            }