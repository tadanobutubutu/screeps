# 📚 API Reference

## Core Modules

### main.js

Main game loop.

```javascript
module.exports.loop = function() {
  // Main game logic
}
```

### Role Modules

#### role.harvester

Energy harvesting role.

```javascript
const roleHarvester = {
  run: function(creep) {
    // Harvest energy
  }
};
```

#### role.upgrader

Controller upgrading role.

#### role.builder

Construction role.

### Utility Modules

#### utils.logging

Logging system.

```javascript
const logger = require('utils.logging');

logger.error("Error message");
logger.warn("Warning message");
logger.info("Info message");
```

**Methods**:
- `error(message)` - Log error
- `warn(message)` - Log warning
- `info(message)` - Log info
- `getStats()` - Get log statistics
- `clear()` - Clear logs

## Memory Structure

```javascript
Memory = {
  logs: [],      // Log entries (max 100)
  creeps: {},    // Creep memory
  rooms: {},     // Room memory
  stats: {}      // Statistics
}
```

