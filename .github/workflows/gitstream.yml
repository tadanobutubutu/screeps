name: GitStream

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  gitstream:
    runs-on: ubuntu-latest
    steps:
      - name: GitStream
        uses: linear-bots/gitstream-github-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitstream-config: |
            rules:
              - if:
                  all:
                    - changed:
                        files:
                          - "src/**"
                          - "tests/**"
                    - hasLabel:
                        - "needs-review"
                then:
                  require:
                    - check: "CI"
                    - check: "CodeQL"
                    - check: "Dependency Review"
                  requireAll: true
              - if:
                  all:
                    - changed:
                        files:
                          - ".github/workflows/**"
                    - hasLabel:
                        - "ci"
                then:
                  require:
                    - check: "CI"
                  requireAll: true
              - if:
                  all:
                    - changed:
                        files:
                          - "package.json"
                          - "package-lock.json"
                          - "yarn.lock"
                          - "pnpm-lock.yaml"
                then:
                  require:
                    - check: "Dependency Review"
                  requireAll: true
