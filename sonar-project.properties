# SonarCloud project configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=tadanobutubutu_screeps
sonar.organization=tadanobutubutu

# Project metadata
sonar.projectName=screeps
sonar.projectVersion=1.0

# Source settings
sonar.sources=.

# Exclude everything from scanning - this is a game AI repo, not a web app
# JS/PY files use Math.random() intentionally for game logic (not cryptography)
sonar.exclusions=**/*.js,**/*.py,**/*.ts,node_modules/**,.github/**

# Also exclude from coverage and duplication checks
sonar.coverage.exclusions=**/*.js,**/*.py
sonar.cpd.exclusions=**/*.js,**/*.py

# Python version
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8
