name: 🚀 Unified CI (Lint, Test, Coverage & Analysis)

on:
    push:
        branches: [main]
        paths:
            - '**.js'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/ci.yml'
    pull_request:
        branches: [main]
        paths:
            - '**.js'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/ci.yml'
    schedule:
        - cron: '0 0 * * *' # Daily UTC 0:00 (JST 9:00)
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    lint:
        runs-on: ubuntu-latest
        name: ⬢ Lint & Check Code
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Run ESLint
              run: pnpm lint || true

            - name: Check Code Complexity
              run: |
                  TOTAL_LINES=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -exec wc -l {} + | tail -1 | awk '{print $1}')
                  FILE_COUNT=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' | wc -l)
                  echo "Total lines: $TOTAL_LINES, Files: $FILE_COUNT"
                  if [ $FILE_COUNT -gt 0 ]; then
                    AVG=$((TOTAL_LINES / FILE_COUNT))
                    echo "Average lines per file: $AVG"
                    if [ $AVG -gt 500 ]; then
                      echo "⚠️ Warning: Large files detected. Consider refactoring."
                    fi
                  fi

            - name: Check for TODOs
              run: |
                  TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX\|HACK" --include="*.js" . 2>/dev/null | wc -l || echo 0)
                  echo "Found $TODO_COUNT TODOs/FIXMEs"

    test-and-analyze:
        runs-on: ubuntu-latest
        name: 🧪 Jest & Code Quality Analysis
        # Avoid duplicate runs on automated skip comments
        if: |
            !contains(github.event.head_commit.message, '[skip ci]') &&
            github.actor != 'google-labs-jules[bot]'
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Run Jest tests & collect coverage
              run: npx jest --coverage --coverageReporters=lcov --passWithNoTests

            - name: Upload test results to Kleore
              if: always()
              run: |
                curl -s -X POST "https://www.kleore.com/api/repos/cmpu1vbx504oxnd29mfwu3meg/upload" \
                  -H "X-Upload-Token: ${{ secrets.KLEORE_UPLOAD_TOKEN }}" \
                  -H "X-Workflow-Run-Id: ${{ github.run_id }}" \
                  -H "Content-Type: application/xml" \
                  --data-binary @test-results/junit.xml

            - name: Build with Rollup (Bundle Analysis)
              run: pnpm build || true

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  flags: unittests
                  fail_ci_if_error: false
                  verbose: true

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/test-results-action@v1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./test-results/junit.xml

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            - name: Codecov Low Coverage Reporter (Schedule/Dispatch Only)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              uses: actions/github-script@v9
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      let coverageData = null;

                      try {
                        const summary = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
                        coverageData = JSON.parse(summary);
                      } catch (e) {
                        console.log('No coverage data found, skipping.');
                        return;
                      }

                      const total = coverageData.total;
                      if (!total) {
                        console.log('No total coverage data found, skipping.');
                        return;
                      }

                      const lowCoverageFiles = [];
                      for (const [file, data] of Object.entries(coverageData)) {
                        if (file === 'total') continue;
                        const linesPct = data?.lines?.pct ?? 100;
                        if (linesPct < 50) {
                          const fileName = file.replace('/root/.openclaw/workspace/screeps-clone/', '');
                          lowCoverageFiles.push(
                            `- \`${fileName}\`: Lines ${linesPct.toFixed(2)}% / Functions ${(data?.functions?.pct ?? 100).toFixed(2)}% / Branches ${(data?.branches?.pct ?? 100).toFixed(2)}%`
                          );
                        }
                      }

                      if (lowCoverageFiles.length === 0) {
                        console.log('All files have acceptable coverage. Skipping.');
                        return;
                      }

                      const issueTitle = `📊 Codecov: カバレッジが低いファイルにテストを追加してください (${lowCoverageFiles.length}件)`;
                      const existing = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: 'codecov'
                      });
                      if (existing.data.some(i => i.title === issueTitle)) {
                        console.log('Issue already exists. Skipping.');
                        return;
                      }

                      const body = [
                        '## 📊 Codecov カバレッジレポート',
                        '',
                        `**総合カバレッジ**: Lines ${total.lines.pct}% / Statements ${total.statements.pct}% / Branches ${total.branches.pct}% / Functions ${total.functions.pct}%`,
                        '',
                        '### ⚠️ カバレッジ50%未満のファイル',
                        '',
                        lowCoverageFiles.join('\n'),
                        '',
                        '---',
                        '上記のファイルにJestユニットテストを追加してカバレッジを50%以上に改善してください。',
                      ].join('\n');

                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: issueTitle,
                        body: body,
                        labels: ['codecov', 'enhancement']
                      });

            - name: SonarCloud Critical Issue Reporter (Schedule/Dispatch Only)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              uses: actions/github-script@v9
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const org = process.env.SONAR_ORGANIZATION;
                      const token = process.env.SONAR_TOKEN;
                      const projectKey = `${org}:screeps`;

                      let issues = [];
                      try {
                        const response = await fetch(
                          `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&resolved=false&severities=CRITICAL,MAJOR&ps=20`,
                          { headers: { 'Authorization': `Bearer ${token}` } }
                        );
                        const data = await response.json();
                        issues = data.issues || [];
                      } catch (e) {
                        console.log('Failed to fetch SonarCloud issues:', e.message);
                        return;
                      }

                      if (issues.length === 0) {
                        console.log('No critical/major issues found. Skipping.');
                        return;
                      }

                      const issueTitle = `🔍 SonarCloud: ${issues.length}件のコード品質問題を修正してください`;
                      const existing = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: 'sonarcloud'
                      });
                      if (existing.data.some(i => i.title === issueTitle)) {
                        console.log('Issue already exists. Skipping.');
                        return;
                      }

                      const issueList = issues.slice(0, 10).map(issue => {
                        const file = issue.component.split(':').pop();
                        const line = issue.line ? `:${issue.line}` : '';
                        const type = issue.type || 'ISSUE';
                        return `- **[${issue.severity}][${type}]** \`${file}${line}\`\n  ${issue.message}`;
                      }).join('\n');

                      const body = [
                        '## 🔍 SonarCloud 定期スキャン結果',
                        '',
                        `**${issues.length}件**の重要な問題が検出されました。`,
                        '',
                        '### 検出された問題',
                        '',
                        issueList,
                        '',
                        `> 詳細: https://sonarcloud.io/project/issues?id=${org}&resolved=false`,
                      ].join('\n');

                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: issueTitle,
                        body: body,
                        labels: ['sonarcloud', 'bug']
                      });

    auto-format:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        name: 🧹 Auto-Format (Prettier/ESLint Fix)
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Run Format & ESLint Fix
              run: |
                  pnpm format
                  pnpm lint

            - name: Create PR if Changed
              run: |
                  git config user.name 'Code Formatter Bot'
                  git config user.email 'formatter@screeps.local'

                  git add *.js package.json pnpm-lock.yaml pnpm-workspace.yaml
                  if git diff --staged --quiet; then
                    echo "No formatting changes"
                    exit 0
                  fi

                  BRANCH="auto-format-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "$BRANCH"
                  git commit -m "Auto-format: ESLint + Prettier applied"
                  git push origin "$BRANCH"

                  gh pr create \
                    --title "Auto-format: $(date +%Y-%m-%d)" \
                    --body "Automated ESLint + Prettier formatting applied." \
                    --base main \
                    --head "$BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
