name: Auto Assign

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Assign
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const config = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/auto-assign.yml'
            });
            const yaml = require('js-yaml');
            const decoded = Buffer.from(config.data.content, 'base64').toString();
            const autoAssign = yaml.load(decoded);
            const assignees = autoAssign.assignees || [];
            if (assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: number,
                assignees
              });
            }
