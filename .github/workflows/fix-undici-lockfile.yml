name: Fix Undici Lockfile

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile consistency
        run: |
          npm ls undici 2>/dev/null || echo "undici not found, skipping"
          npm install --package-lock-only --ignore-scripts 2>&1 | tail -5
          if git diff --quiet package-lock.json; then
            echo "Lockfile is consistent"
          else
            echo "::warning::Lockfile has changes. Run 'npm install --package-lock-only' to fix."
            git diff --stat package-lock.json
          fi
