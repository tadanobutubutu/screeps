name: 🛡️ Auto-Fix Action Versions

on:
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  auto-fix-versions:
    runs-on: ubuntu-latest
    name: Detect & auto-fix invalid action versions
    # ボット自身のコミットで無限ループしないようスキップ
    if: github.actor != 'Version Guard Bot' && !contains(github.event.head_commit.message, 'Auto-fix: revert invalid action versions')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Scan for invalid action versions
        id: scan
        run: |
          echo "🔍 Scanning .github/workflows/ for invalid action versions (v5+)..."

          INVALID=$(grep -rn 'uses:.*actions/.*@v[5-9][0-9]*' .github/workflows/ \
            --include='*.yml' \
            --exclude='validate-action-versions.yml' 2>/dev/null || true)

          if [ -n "$INVALID" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "⚠️ Invalid versions found:"
            echo "$INVALID"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "✅ All action versions are valid!"
          fi

      - name: Auto-fix to v4
        if: steps.scan.outputs.found == 'true'
        run: |
          echo "🔧 Fixing invalid versions to @v4..."

          find .github/workflows/ -name '*.yml' \
            ! -name 'validate-action-versions.yml' | while read f; do
            sed -i \
              -e 's|actions/checkout@v[5-9][0-9]*|actions/checkout@v4|g' \
              -e 's|actions/setup-node@v[5-9][0-9]*|actions/setup-node@v4|g' \
              -e 's|actions/upload-artifact@v[5-9][0-9]*|actions/upload-artifact@v4|g' \
              -e 's|actions/download-artifact@v[5-9][0-9]*|actions/download-artifact@v4|g' \
              -e 's|actions/cache@v[5-9][0-9]*|actions/cache@v4|g' \
              -e 's|actions/github-script@v[5-9][0-9]*|actions/github-script@v6|g' \
              "$f"
          done

          echo "✅ Done. Changes:"
          git diff

      - name: Commit fix
        if: steps.scan.outputs.found == 'true'
        run: |
          git config user.name 'Version Guard Bot'
          git config user.email 'version-guard@screeps.bot'
          git add .github/workflows/
          git diff --staged --quiet || (
            git commit -m "🔧 Auto-fix: revert invalid action versions to stable (v4)"
            git push
          )
          echo "✅ Fix committed and pushed!"
