name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# ループ防止: Julesのコミットではスキップ
jobs:
  coverage:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'google-labs-jules[bot]'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest coverage
        run: npx jest --coverage --coverageReporters=lcov --passWithNoTests
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Post low coverage comment for Jules
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let coverageData = null;

            try {
              const summary = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
              coverageData = JSON.parse(summary);
            } catch (e) {
              console.log('No coverage data found, skipping comment');
              return;
            }

            const total = coverageData.total;
            const linePct = total.lines.pct;
            const stmtPct = total.statements.pct;
            const branchPct = total.branches.pct;
            const funcPct = total.functions.pct;

            // カバレッジが低いファイルを検出
            const lowCoverageFiles = [];
            for (const [file, data] of Object.entries(coverageData)) {
              if (file === 'total') continue;
              if (data.lines.pct < 50) {
                lowCoverageFiles.push(`- \`${file}\`: ${data.lines.pct}% line coverage`);
              }
            }

            let body = `## 📊 Codecov Coverage Report\n\n`;
            body += `| Metric | Coverage |\n|--------|----------|\n`;
            body += `| Lines | ${linePct}% |\n`;
            body += `| Statements | ${stmtPct}% |\n`;
            body += `| Branches | ${branchPct}% |\n`;
            body += `| Functions | ${funcPct}% |\n\n`;

            if (lowCoverageFiles.length > 0) {
              body += `### ⚠️ Low Coverage Files (< 50%)\n\n`;
              body += lowCoverageFiles.join('\n');
              body += `\n\n---\n`;
              body += `@google-labs-jules テストカバレッジが低いファイルがあります。上記ファイルにJestユニットテストを追加してカバレッジを改善してください。`;
            } else {
              body += `✅ All files have acceptable coverage!`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
