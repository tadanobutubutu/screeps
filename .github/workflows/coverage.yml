name: Coverage Report + Jules Auto-Fix

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'  # 毎日UTC1時（JST10時）に定期スキャン

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest coverage
        run: npx jest --coverage --coverageReporters=lcov json-summary --passWithNoTests
        continue-on-error: true

      - name: Build with Rollup (Codecov Bundle Analysis)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create Issue for low coverage files
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let coverageData = null;

            try {
              const summary = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
              coverageData = JSON.parse(summary);
            } catch (e) {
              console.log('No coverage data found, skipping.');
              return;
            }

            const total = coverageData.total;
            if (!total) {
              console.log('No total coverage data found, skipping.');
              return;
            }

            // カバレッジ50%未満のファイルを検出（totalキーはスキップ）
            const lowCoverageFiles = [];
            for (const [file, data] of Object.entries(coverageData)) {
              if (file === 'total') continue;
              // 各ファイルデータのlines.pctが50%未満なら追加
              const linesPct = data?.lines?.pct ?? 100;
              if (linesPct < 50) {
                const fileName = file.replace('/root/.openclaw/workspace/screeps-clone/', '');
                lowCoverageFiles.push(
                  `- \`${fileName}\`: Lines ${linesPct.toFixed(2)}% / Functions ${(data?.functions?.pct ?? 100).toFixed(2)}% / Branches ${(data?.branches?.pct ?? 100).toFixed(2)}%`
                );
              }
            }

            if (lowCoverageFiles.length === 0) {
              console.log('All files have acceptable coverage. Skipping.');
              return;
            }

            // 重複Issue防止
            const issueTitle = `📊 Codecov: カバレッジが低いファイルにテストを追加してください (${lowCoverageFiles.length}件)`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'codecov'
            });
            const alreadyExists = existing.data.some(i => i.title === issueTitle);
            if (alreadyExists) {
              console.log('Issue already exists. Skipping.');
              return;
            }

            const body = [
              '## 📊 Codecov カバレッジレポート',
              '',
              `**総合カバレッジ**: Lines ${total.lines.pct}% / Statements ${total.statements.pct}% / Branches ${total.branches.pct}% / Functions ${total.functions.pct}%`,
              '',
              '### ⚠️ カバレッジ50%未満のファイル',
              '',
              lowCoverageFiles.join('\n'),
              '',
              '---',
              '上記のファイルにJestユニットテストを追加してカバレッジを50%以上に改善してください。',
              '',
              '**ガイドライン**:',
              '- GitHub Actionsのバージョンは変更しないこと',
              '- プロジェクトの既存テストパターンに従うこと',
            ].join('\n');

            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels: ['codecov', 'enhancement']
            });

            console.log(`✅ Created issue #${newIssue.data.number}`);
