name: 📊 Weekly Quality Report

on:
  schedule:
    # 毎週月曜日 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  quality-report:
    runs-on: ubuntu-latest
    name: Generate Weekly Quality Report

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Run tests and collect metrics
        id: metrics
        run: |
          # テスト実行
          TEST_RESULT=$(npx jest --passWithNoTests --json 2>/dev/null || echo '{"numPassedTests":0,"numFailedTests":0,"numTotalTests":0}')

          PASSED=$(echo "$TEST_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).numPassedTests||0)}catch{console.log(0)}})")
          FAILED=$(echo "$TEST_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).numFailedTests||0)}catch{console.log(0)}})")
          TOTAL=$(echo "$TEST_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).numTotalTests||0)}catch{console.log(0)}})")

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # ファイル統計
          JS_FILES=$(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" | wc -l | tr -d ' ')
          ROLE_FILES=$(find . -name "role.*.js" -not -path "./node_modules/*" | wc -l | tr -d ' ')
          TOTAL_LINES=$(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}')
          WORKFLOW_COUNT=$(ls .github/workflows/*.yml 2>/dev/null | wc -l | tr -d ' ')

          echo "js_files=$JS_FILES" >> $GITHUB_OUTPUT
          echo "role_files=$ROLE_FILES" >> $GITHUB_OUTPUT
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
          echo "workflow_count=$WORKFLOW_COUNT" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run ESLint check
        id: lint
        run: |
          LINT_RESULT=$(npx eslint . --format json 2>/dev/null || echo '[]')
          ERRORS=$(echo "$LINT_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);console.log(r.reduce((s,f)=>s+f.errorCount,0))}catch{console.log('N/A')}})")
          WARNINGS=$(echo "$LINT_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);console.log(r.reduce((s,f)=>s+f.warningCount,0))}catch{console.log('N/A')}})")
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for outdated dependencies
        id: outdated
        run: |
          OUTDATED=$(npx -y npm-check-updates --jsonUpgraded 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(Object.keys(JSON.parse(d)).length)}catch{console.log(0)}})")
          echo "count=$OUTDATED" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create quality report issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            const issueTitle = `📊 週次品質レポート: ${date}`;

            // 重複防止
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'quality-report'
            });
            if (existing.data.some(i => i.title === issueTitle)) {
              console.log('Report already exists. Skipping.');
              return;
            }

            // 前回のレポートを自動クローズ
            for (const issue of existing.data) {
              if (issue.title.startsWith('📊 週次品質レポート:')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

            const passed = '${{ steps.metrics.outputs.passed }}' || '0';
            const failed = '${{ steps.metrics.outputs.failed }}' || '0';
            const total = '${{ steps.metrics.outputs.total }}' || '0';
            const jsFiles = '${{ steps.metrics.outputs.js_files }}' || '0';
            const roleFiles = '${{ steps.metrics.outputs.role_files }}' || '0';
            const totalLines = '${{ steps.metrics.outputs.total_lines }}' || '0';
            const workflowCount = '${{ steps.metrics.outputs.workflow_count }}' || '0';
            const lintErrors = '${{ steps.lint.outputs.errors }}' || 'N/A';
            const lintWarnings = '${{ steps.lint.outputs.warnings }}' || 'N/A';
            const outdated = '${{ steps.outdated.outputs.count }}' || '0';

            const body = [
              '## 📊 Screeps AI 週次品質レポート',
              '',
              `**レポート日**: ${date}`,
              '',
              '### 🧪 テスト結果',
              '',
              `| 指標 | 値 |`,
              `|------|------|`,
              `| ✅ 成功 | ${passed} |`,
              `| ❌ 失敗 | ${failed} |`,
              `| 📋 合計 | ${total} |`,
              '',
              '### 📝 コード品質 (ESLint)',
              '',
              `| 指標 | 値 |`,
              `|------|------|`,
              `| ❌ エラー | ${lintErrors} |`,
              `| ⚠️ 警告 | ${lintWarnings} |`,
              '',
              '### 📊 コード統計',
              '',
              `| 指標 | 値 |`,
              `|------|------|`,
              `| 📄 JSファイル数 | ${jsFiles} |`,
              `| 🎭 ロール数 | ${roleFiles} |`,
              `| 📝 総コード行数 | ${totalLines} |`,
              `| 🔄 ワークフロー数 | ${workflowCount} |`,
              `| 📦 更新可能な依存関係 | ${outdated} |`,
              '',
              '### 🔗 外部サービス',
              '',
              `- [SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=tadanobutubutu_screeps)`,
              `- [Codecov Dashboard](https://app.codecov.io/gh/tadanobutubutu/screeps)`,
              '',
              '---',
              '*このレポートは GitHub Actions により自動生成されています*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels: ['quality-report', 'automated']
            });
