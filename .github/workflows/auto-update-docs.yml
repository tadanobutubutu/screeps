name: 📚 Auto Update Documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'role.*.js'
      - '*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    name: Update Documentation Files
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Analyze repository and update README via AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/ai_update_readme.py
      
      - name: Commit updated documentation
        run: |
          git config user.name 'AI Documentation Bot'
          git config user.email 'docs@screeps.local'
          git add README.md
          
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "📚 Auto-update documentation: ${TIMESTAMP}
            
            - Updated README.md with current statistics
            - Refreshed workflow count and role list
            - Generated repo-stats.json"
            git push
          else
            echo "No documentation changes needed"
          fi
