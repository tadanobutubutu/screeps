name: Fix undici - Regenerate package-lock.json

on:
  workflow_dispatch:

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate package-lock.json
        run: |
          # Delete old lockfile and regenerate with overrides applied
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Verify undici version
        run: |
          echo "=== undici versions in lockfile ==="
          cat package-lock.json | grep -A2 '"undici"' | grep version || true
          # Ensure no 5.x undici remains
          if grep -q '"undici-5\|undici/-/undici-5' package-lock.json; then
            echo "ERROR: undici 5.x still present!"
            exit 1
          fi
          echo "SUCCESS: undici 5.x not found in lockfile"

      - name: Commit updated package-lock.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix(security): regenerate package-lock.json to apply undici>=6.24.0 override (CVE-2026-1527)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
