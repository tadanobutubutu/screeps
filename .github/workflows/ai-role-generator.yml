name: AI Dynamic Role Generator

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:
    inputs:
      role_concept:
        description: 'Describe the new role you want (e.g. "Scout that avoids enemies")'
        required: false

permissions:
  issues: write

jobs:
  propose-role:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze current roles and propose new one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCEPT: ${{ github.event.inputs.role_concept }}
        run: |
          ROLES=$(ls src/roles/ 2>/dev/null | tr '\n' ', ')
          
          if [ -z "$CONCEPT" ]; then
            BODY="AI Sentinel requests a new, innovative Screeps role. Currently we have: $ROLES. Please create a new JS file in src/roles/ with a completely unique logic (e.g., advanced combat, remote mining, or economy boosting)."
          else
            BODY="Please implement a new Screeps role based on this concept: $CONCEPT. Currently we have: $ROLES. Create a new JS file in src/roles/."
          fi
          
          gh issue create --title "🚨 AI Request: Dynamically Generate New Creep Role" --body "$BODY" --label "ai-solve,enhancement" || true
