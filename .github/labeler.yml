# PR Labeler configuration - automatically label PRs based on file changes

documentation:
  - "**/*.md"
  - "docs/**/*"
  - "wiki/**/*"

github-actions:
  - ".github/workflows/**/*"
  - ".github/actions/**/*"

dependencies:
  - "package.json"
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"

javascript:
  - "**/*.js"
  - "**/*.mjs"
  - "**/*.cjs"

config:
  - "**/*.json"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.toml"
  - ".gitignore"
  - ".gitattributes"

test:
  - "**/*.test.js"
  - "**/*.spec.js"
  - "test/**/*"
  - "tests/**/*"

ci:
  - ".github/**/*"
  - ".gitlab-ci.yml"
  - ".circleci/**/*"
  - "azure-pipelines.yml"

security:
  - "SECURITY.md"
  - ".github/workflows/codeql.yml"
  - ".github/workflows/secret-scanning.yml"
  - ".gitleaks.toml"

bot:
  - ".github/dependabot.yml"
  - ".github/renovate.json"
  - ".github/mergify.yml"
  - ".all-contributorsrc"
