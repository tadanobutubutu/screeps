name: AI Issue Resolver (Ultimate Resilience)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: |
      github.event.issue.pull_request == null && 
      (github.event_name == 'workflow_dispatch' || 
       contains(github.event.issue.labels.*.name, 'ai-solve') ||
       contains(github.event.comment.body, '@ai solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: AI Solve Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          echo "🤖 Starting AI Issue Resolution (DuckDuckGo AI)..."
          
          # 1. Fetch Context
          ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body,comments)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          COMMENTS=$(echo "$ISSUE_DATA" | jq -r '.comments[].body')
          FILES=$(find . -maxdepth 2 -not -path '*/.*' | head -n 20)
          
          # 2. Build Prompt
          PROMPT="Solve this GitHub Issue in a JavaScript/TypeScript repo.
          Title: $TITLE
          Body: $BODY
          Comments: $COMMENTS
          Existing Files: $FILES
          
          Respond ONLY with a JSON array: [{\"path\": \"file\", \"content\": \"full content\"}]
          No markdown backticks. No talk. Just JSON."

          # 3. DuckDuckGo AI Script (Free, No Key)
          cat << 'EOF' > ddg_ai.py
import sys, requests, json
def solve():
    prompt = sys.stdin.read()
    s = requests.Session()
    # Get VQD
    res = s.get("https://duckduckgo.com/duckchat/v1/status", headers={"x-vqd-4": "1", "User-Agent": "Mozilla/5.0"})
    vqd = res.headers.get("x-vqd-4")
    if not vqd: return None
    # Chat
    payload = {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": prompt}]}
    res = s.post("https://duckduckgo.com/duckchat/v1/chat", 
                 headers={"x-vqd-4": vqd, "Content-Type": "application/json", "User-Agent": "Mozilla/5.0"},
                 json=payload)
    if res.status_code != 200: return None
    # Parse stream
    full = ""
    for line in res.text.split('\n'):
        if line.startswith('data: '):
            d = line[6:]
            if d == '[DONE]': break
            try:
                msg = json.loads(d).get('message', '')
                full += msg
            except: continue
    return full
if __name__ == "__main__":
    result = solve()
    if result: print(result)
    else: sys.exit(1)
EOF

          RESOLVED=$(echo "$PROMPT" | python3 ddg_ai.py || echo "")
          
          if [ -z "$RESOLVED" ]; then
             echo "⚠️ DDG AI failed. Trying Pollinations fallback..."
             RESOLVED=$(curl -s "https://text.pollinations.ai/$(jq -Rr @uri <<< "$PROMPT")?model=openai" || echo "[]")
          fi

          echo "📝 RAW AI Response: $RESOLVED"
          CLEAN=$(echo "$RESOLVED" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```json/d' | sed '/^```/d' | tr -d '\r')
          
          # 4. Apply
          if echo "$CLEAN" | jq -e '. | is_array and length > 0' > /dev/null 2>&1; then
            BRANCH="ai-fix-$ISSUE_NUMBER-$(date +%s)"
            git checkout -b "$BRANCH"
            echo "$CLEAN" | jq -c '.[]' | while read -r change; do
              P=$(echo "$change" | jq -r '.path')
              C=$(echo "$change" | jq -r '.content')
              mkdir -p "$(dirname "$P")"
              echo "$C" > "$P"
            done
            git config user.name "AI Resolver"
            git config user.email "ai@screeps.local"
            git add .
            git commit -m "fix: AI auto-resolve #$ISSUE_NUMBER"
            git push origin "$BRANCH"
            gh pr create --title "AI Solution for #$ISSUE_NUMBER" --body "Automated fix for #$ISSUE_NUMBER. Closes #$ISSUE_NUMBER" --head "$BRANCH" --base main
            gh issue comment $ISSUE_NUMBER --body "🤖 AI fix proposed in linked PR using GPT-4o-mini (Free)."
          else
            echo "❌ No fix generated."
            gh issue comment $ISSUE_NUMBER --body "🤖 AI analysis complete. No automated fix could be generated at this time."
          fi
