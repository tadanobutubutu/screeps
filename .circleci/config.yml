version: 2.1

# ==============================================================================
# 🚀 Screeps AI - CircleCI Unified CI/CD Pipeline
# ==============================================================================
# GitHub Actions から全面移行。以下の機能を統合:
#   - CI (Lint, Test, Coverage, SonarCloud)
#   - Deploy to Screeps PTR
#   - Auto-Format (Prettier/ESLint)
#   - Game Monitor
#   - Error Threshold Monitor
#   - Supabase KeepAlive
#   - Zenodo DOI Release
#   - Auto-assign / PR-labeler / Welcome
#   - Stale issue management
#   - Label sync
#   - Weekly quality report
#   - Wiki/Docs auto-update
#   - Version validation
#   - AI Code Maintenance
#   - Emergency API Restore
# ==============================================================================

# ---------- Orbs ----------
orbs:
  node: circleci/node@7
  gh: circleci/github-cli@2
  sonarcloud: sonarsource/sonarcloud@3

# ---------- Executors ----------
executors:
  node-executor:
    docker:
      - image: cimg/node:24.0
    working_directory: ~/project
    resource_class: medium

# ---------- Commands (再利用可能ステップ) ----------
commands:
  setup-pnpm:
    description: "pnpmをインストールし依存関係を復元"
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@latest --activate
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.local/share/pnpm/store

  setup-git-identity:
    description: "Gitのユーザー情報を設定"
    parameters:
      git-name:
        type: string
        default: "CircleCI Bot"
      git-email:
        type: string
        default: "circleci@screeps.local"
    steps:
      - run:
          name: Configure Git identity
          command: |
            git config user.name '<< parameters.git-name >>'
            git config user.email '<< parameters.git-email >>'

  commit-and-push:
    description: "変更があればコミットしてプッシュ"
    parameters:
      message:
        type: string
      files:
        type: string
        default: "."
    steps:
      - run:
          name: Commit and push if changed
          command: |
            git add << parameters.files >>
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "<< parameters.message >>"
              git push origin HEAD
            fi

# ============================================================================
# JOBS
# ============================================================================

jobs:
  # ---------- CI: Lint ----------
  lint:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: "⬢ Run ESLint"
          command: pnpm lint || true
      - run:
          name: "📏 Check Code Complexity"
          command: |
            TOTAL_LINES=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -exec wc -l {} + | tail -1 | awk '{print $1}')
            FILE_COUNT=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' | wc -l)
            echo "Total lines: $TOTAL_LINES, Files: $FILE_COUNT"
            if [ "$FILE_COUNT" -gt 0 ]; then
              AVG=$((TOTAL_LINES / FILE_COUNT))
              echo "Average lines per file: $AVG"
              if [ "$AVG" -gt 500 ]; then
                echo "⚠️ Warning: Large files detected. Consider refactoring."
              fi
            fi
      - run:
          name: "📋 Check for TODOs"
          command: |
            TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX\|HACK" --include="*.js" . 2>/dev/null | wc -l || echo 0)
            echo "Found $TODO_COUNT TODOs/FIXMEs"

  # ---------- CI: Test & Coverage ----------
  test-and-coverage:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: "🧪 Run Jest tests with coverage"
          command: npx jest --coverage --coverageReporters=lcov --coverageReporters=json-summary --passWithNoTests
      - run:
          name: "📦 Build with Rollup"
          command: pnpm build || true
      - run:
          name: "📤 Upload to Codecov"
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process --file ./coverage/lcov.info --flags unittests --token "$CODECOV_TOKEN" || true
      - sonarcloud/scan
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage

  # ---------- Deploy to Screeps PTR ----------
  deploy-screeps:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: "🚀 Deploy to Screeps PTR"
          command: node deploy.js
          environment:
            SCREEPS_TOKEN: ${SCREEPS_TOKEN}
            SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
            SENTRY_DSN: ${SENTRY_DSN}
            POSTHOG_API_KEY: ${POSTHOG_API_KEY}

  # ---------- Auto-Format ----------
  auto-format:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - setup-git-identity:
          git-name: "Code Formatter Bot"
          git-email: "formatter@screeps.local"
      - run:
          name: "🧹 Run Format & ESLint Fix"
          command: |
            pnpm format
            pnpm lint
      - run:
          name: "📝 Create PR if changed"
          command: |
            git add *.js package.json pnpm-lock.yaml pnpm-workspace.yaml 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No formatting changes"
              exit 0
            fi

            BRANCH="auto-format-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "Auto-format: ESLint + Prettier applied"
            git push origin "$BRANCH"

            # GitHub CLIでPR作成
            gh pr create \
              --title "Auto-format: $(date +%Y-%m-%d)" \
              --body "Automated ESLint + Prettier formatting applied by CircleCI." \
              --base main \
              --head "$BRANCH"
          environment:
            GH_TOKEN: ${GH_PAT}

  # ---------- Game Monitor ----------
  game-monitor:
    executor: node-executor
    steps:
      - checkout
      - setup-git-identity:
          git-name: "Game Monitor Bot"
          git-email: "monitor@screeps.local"
      - run:
          name: "⏱️ Fetch Console Logs & Stats"
          command: node scripts/ci-game-monitor.js
      - commit-and-push:
          message: "⏱️  Stats & logs update: $(date '+%Y-%m-%d %H:%M')"
          files: "GAME_STATUS.md CONSOLE_LOGS.md DETECTED_ERRORS.json"

  # ---------- Error Threshold Monitor ----------
  error-threshold-monitor:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🚨 Analyze Error Rate"
          command: |
            if [ ! -f "DETECTED_ERRORS.json" ]; then
              echo "✅ No errors detected"
              exit 0
            fi

            ERROR_COUNT=$(grep -o '"level": "error"' DETECTED_ERRORS.json | wc -l)
            echo "📊 Error count: $ERROR_COUNT"

            if [ "$ERROR_COUNT" -ge 10 ]; then
              echo "⚠️ High error rate detected!"
              echo "HIGH_ERRORS=true" >> "$BASH_ENV"

              # GH CLIでイシュー作成
              EXISTING=$(gh issue list --repo tadanobutubutu/screeps --label "api-mode-suggestion" --state open | wc -l)
              if [ "$EXISTING" -eq 0 ]; then
                gh issue create \
                  --repo tadanobutubutu/screeps \
                  --title "🚨 Consider Switching to API Mode - High Error Rate ($ERROR_COUNT errors)" \
                  --body "## 📊 Error Analysis\n\n**Error Count**: $ERROR_COUNT\n**Recommendation**: Consider switching to API mode for better monitoring.\n\n---\n*Auto-generated by CircleCI Error Monitor*" \
                  --label "api-mode-suggestion,automated"
              fi
            else
              echo "✅ Error rate is acceptable"
            fi
          environment:
            GH_TOKEN: ${GH_PAT}

  # ---------- Supabase KeepAlive ----------
  supabase-keepalive:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🗄️ Install Supabase client"
          command: npm install @supabase/supabase-js
      - run:
          name: "💓 Run KeepAlive"
          command: node scripts/supabase-keepalive.js
          environment:
            SUPABASE_URL: ${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

  # ---------- Zenodo DOI Release ----------
  zenodo-release:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🔖 Create Zenodo Snapshot"
          command: |
            # 前回タグから変更チェック
            LAST_TAG=$(git tag --sort=-creatordate | grep '^zenodo-' | head -n1 || echo "")
            if [ -n "$LAST_TAG" ]; then
              DIFF=$(git diff --name-only "$LAST_TAG" HEAD -- . ':!.github' ':!.circleci' | wc -l)
              if [ "$DIFF" -eq 0 ]; then
                echo "No changes since $LAST_TAG, skipping."
                exit 0
              fi
            fi

            DATE=$(date -u +%Y.%m.%d)
            TIME=$(date -u +%H%M)
            TAG="zenodo-${DATE}-${TIME}-circleci-${CIRCLE_BUILD_NUM}"

            gh release create "$TAG" \
              --repo tadanobutubutu/screeps \
              --title "[Zenodo DOI only] ${DATE} circleci #${CIRCLE_BUILD_NUM}" \
              --notes "## ⚠️ このリリースは一般利用向けではありません

            Auto-generated for Zenodo DOI archiving.
            - Trigger: CircleCI scheduled
            - Commit: ${CIRCLE_SHA1:0:7}
            - Build: #${CIRCLE_BUILD_NUM}

            ---
            _Personal Screeps bot experiment._" \
              --prerelease
          environment:
            GH_TOKEN: ${GH_PAT}

  # ---------- Stale Issue Management ----------
  stale-issues:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🧹 Process stale issues"
          command: |
            # 30日間アクティビティのないイシューにラベル追加
            STALE_DATE=$(date -u -d "30 days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-30d +%Y-%m-%dT%H:%M:%SZ)

            gh issue list \
              --repo tadanobutubutu/screeps \
              --state open \
              --json number,updatedAt,labels \
              --jq ".[] | select(.updatedAt < \"$STALE_DATE\") | select(.labels | map(.name) | index(\"stale\") | not) | .number" | \
            while read -r ISSUE_NUM; do
              if [ -n "$ISSUE_NUM" ]; then
                echo "Marking issue #$ISSUE_NUM as stale"
                gh issue edit "$ISSUE_NUM" --repo tadanobutubutu/screeps --add-label "stale" 2>/dev/null || true
                gh issue comment "$ISSUE_NUM" --repo tadanobutubutu/screeps --body "This issue has been automatically marked as stale because it has not had activity in 30 days. It will be closed in 7 days if no further activity occurs." 2>/dev/null || true
              fi
            done

            # 7日間さらに放置されたstaleイシューをクローズ
            CLOSE_DATE=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)

            gh issue list \
              --repo tadanobutubutu/screeps \
              --state open \
              --label "stale" \
              --json number,updatedAt \
              --jq ".[] | select(.updatedAt < \"$CLOSE_DATE\") | .number" | \
            while read -r ISSUE_NUM; do
              if [ -n "$ISSUE_NUM" ]; then
                echo "Closing stale issue #$ISSUE_NUM"
                gh issue close "$ISSUE_NUM" --repo tadanobutubutu/screeps --comment "Closing due to inactivity. Feel free to reopen if needed." 2>/dev/null || true
              fi
            done
          environment:
            GH_TOKEN: ${GH_PAT}

  # ---------- Label Sync ----------
  label-sync:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🏷️ Sync labels"
          command: |
            # .github/labels.ymlが存在すればラベル同期
            if [ -f ".github/labels.yml" ]; then
              npx github-label-sync --access-token "$GH_PAT" --labels .github/labels.yml tadanobutubutu/screeps || true
            else
              echo "No labels.yml found, skipping"
            fi
          environment:
            GH_PAT: ${GH_PAT}

  # ---------- Weekly Quality Report ----------
  weekly-quality-report:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - setup-git-identity:
          git-name: "Quality Report Bot"
          git-email: "quality@screeps.local"
      - run:
          name: "📊 Generate Weekly Quality Report"
          command: node scripts/ci-quality-report.js
      - commit-and-push:
          message: "📊 Weekly quality report update"
          files: "WEEKLY_QUALITY_REPORT.md"

  # ---------- Version Validation ----------
  validate-versions:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: "🔍 Validate dependency versions"
          command: |
            echo "📦 Checking for outdated packages..."
            pnpm outdated || true

            echo ""
            echo "🔒 Checking for vulnerabilities..."
            pnpm audit || true

            echo ""
            echo "📋 Node version: $(node -v)"
            echo "📋 pnpm version: $(pnpm -v)"

  # ---------- Wiki/Docs Update ----------
  update-docs:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - setup-git-identity:
          git-name: "Docs Bot"
          git-email: "docs@screeps.local"
      - run:
          name: "📚 Auto-update documentation"
          command: node scripts/ci-update-docs.js
      - commit-and-push:
          message: "📚 Auto-update documentation"
          files: "docs/"

  # ---------- Emergency API Restore (手動トリガーのみ) ----------
  emergency-api-restore:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: "🆘 Emergency API Restore Check"
          command: |
            echo "🔧 Running emergency API restore check..."
            if [ -z "$SCREEPS_TOKEN" ]; then
              echo "❌ SCREEPS_TOKEN not set. Cannot restore API mode."
              echo "Set SCREEPS_TOKEN in CircleCI Environment Variables."
              exit 1
            fi

            echo "✅ SCREEPS_TOKEN is set. Testing API connectivity..."
            node -e "
              const https = require('https');
              const req = https.request({
                hostname: 'screeps.com', port: 443, path: '/api/auth/me',
                method: 'GET', headers: { 'X-Token': process.env.SCREEPS_TOKEN }
              }, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  const result = JSON.parse(data);
                  if (result.ok) {
                    console.log('✅ API connection successful. User:', result.username);
                  } else {
                    console.log('❌ API auth failed:', data);
                    process.exit(1);
                  }
                });
              });
              req.on('error', e => { console.error('❌ Connection error:', e.message); process.exit(1); });
              req.end();
            "
          environment:
            SCREEPS_TOKEN: ${SCREEPS_TOKEN}

  # ---------- Minimal Test (PRゲート用) ----------
  test-minimal:
    executor: node-executor
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: "🧪 Minimal Test"
          command: npx jest --passWithNoTests

# ============================================================================
# WORKFLOWS
# ============================================================================

workflows:
  # ---------- メインCI/CDパイプライン (push/PR時) ----------
  ci-pipeline:
    jobs:
      - lint:
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
                - /^fix\/.*/
                - /^auto-format-.*/
      - test-and-coverage:
          requires:
            - lint
      - deploy-screeps:
          requires:
            - test-and-coverage
          filters:
            branches:
              only: main

  # ---------- 日次メンテナンス (毎日 UTC 0:00 / JST 9:00) ----------
  daily-maintenance:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only: main
    jobs:
      - auto-format
      - validate-versions
      - supabase-keepalive
      - stale-issues
      - label-sync

  # ---------- ゲーム監視 (毎時) ----------
  game-monitoring:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only: main
    jobs:
      - game-monitor

  # ---------- エラー監視 (6時間ごと) ----------
  error-monitoring:
    triggers:
      - schedule:
          cron: "0 0,6,12,18 * * *"
          filters:
            branches:
              only: main
    jobs:
      - error-threshold-monitor

  # ---------- 週次レポート & リリース (毎週月曜 UTC 0:00) ----------
  weekly-tasks:
    triggers:
      - schedule:
          cron: "0 0 * * 1"
          filters:
            branches:
              only: main
    jobs:
      - weekly-quality-report
      - zenodo-release
      - update-docs
