name: 📚 Update Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    name: Update GitHub Wiki
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
      
      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
        continue-on-error: true
      
      - name: Copy Wiki Files
        run: |
          echo "📝 Copying wiki files..."
          
          # Create wiki-repo directory if checkout failed
          if [ ! -d "wiki-repo" ]; then
            echo "📝 Wiki repo not found, initializing..."
            mkdir -p wiki-repo
            cd wiki-repo
            git init
            git remote add origin "https://github.com/${{ github.repository }}.wiki.git" || true
            cd ..
          fi
          
          # Create wiki directory if it doesn't exist in main repo
          mkdir -p wiki
          
          # If wiki files exist in main repo, copy them to wiki repo
          if [ -d "wiki" ] && [ "$(ls -A wiki)" ]; then
            cp -r wiki/* wiki-repo/ 2>/dev/null || echo "No files to copy yet"
          else
            echo "📝 Creating default wiki pages..."
            
            # Create Home page
            cat > wiki-repo/Home.md << 'EOF'
