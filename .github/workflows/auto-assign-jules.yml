name: 🤖 Auto-Mention Jules on Bot Issues

# Botが作成したIssueにのみ @google-labs-jules をmentionする
# 外部ユーザーのIssueには絶対に反応しない（Prompt Injection防止）

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  mention-jules:
    runs-on: ubuntu-latest
    name: Mention Jules on Bot Issues

    # 信頼できるBotが作成したIssueのみ処理する
    if: |
      contains(fromJson('[
        "github-actions[bot]",
        "workflow-health-bot",
        "security-monitor-bot"
      ]'), github.event.issue.user.login)

    steps:
      - name: Check if Jules should be notified
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();

            // 信頼できるBotのホワイトリスト
            const TRUSTED_BOTS = [
              'github-actions[bot]',
              'workflow-health-bot',
              'security-monitor-bot'
            ];

            const creator = issue.user.login;
            if (!TRUSTED_BOTS.includes(creator)) {
              console.log(`❌ Skipping: "${creator}" is not a trusted bot.`);
              return;
            }

            // 修正が必要そうなキーワードをチェック
            const fixKeywords = [
              'failure', 'failed', 'error', 'fix', 'broken',
              'bug', 'vulnerability', 'security', 'invalid', 'crash',
              'エラー', '修正', '問題', '失敗', '脆弱性'
            ];

            const needsFix = fixKeywords.some(kw => title.includes(kw) || body.includes(kw));

            if (!needsFix) {
              console.log('ℹ️ No fix keywords found. Skipping Jules mention.');
              return;
            }

            console.log('✅ Fix keywords found. Will mention Jules.');
            core.setOutput('should_mention', 'true');

      - name: Mention Jules in comment
        if: steps.check.outputs.should_mention == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const title = issue.title;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '### 🤖 Jules Auto-Fix Request',
                '',
                `@google-labs-jules This issue was automatically detected by a trusted bot.`,
                '',
                '**Task**: Please investigate and fix the issue described above.',
                '',
                '**Guidelines**:',
                '- Do **not** upgrade any GitHub Actions versions (e.g. keep `actions/checkout@v4`, never use `@v5` or above)',
                '- Do not modify secret names or `runs-on` values',
                '- See `.github/JULES_INSTRUCTIONS.md` for full rules',
                '',
                '---',
                '*This mention was triggered automatically by a trusted bot issue. External user issues are ignored.*'
              ].join('\n')
            });

            console.log(`✅ @google-labs-jules mentioned on issue #${issueNumber}`);
