name: Auto Zenodo Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install zenodo-api

      - name: Upload to Zenodo
        run: |
          python -c "
          import os
          import zenodo_api
          token = os.environ.get('ZENODO_TOKEN')
          if token:
              print('Zenodo upload configured')
          else:
              print('ZENODO_TOKEN not set, skipping')
          "
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
