name: Auto Merge PRs - Force Penetration (Instant CI)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to merge (optional)'
        required: false
      batch_limit:
        description: 'Number of oldest PRs to batch merge'
        required: false
        default: '25'

concurrency:
  group: auto-merge-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  force-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Force Merge PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '25' }}
        run: |
          if [ -n "$EVENT_PR" ]; then
            echo "Processing single PR #$EVENT_PR..."
            python3 scripts/force_merge_pr.py "$EVENT_PR" || true
          else
            echo "Processing batch of oldest PRs (Limit: $BATCH_LIMIT)..."
            python3 scripts/force_merge_pr.py --batch "$BATCH_LIMIT" || true
          fi
