name: AI Governance

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Governance Check
        run: npm run ai:governance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
