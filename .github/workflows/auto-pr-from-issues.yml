name: 🤖 Auto PR from Issues

on:
  # disabled_by_guard: issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: false

permissions:
  # disabled_by_guard: issues: write
  pull-requests: write
  contents: write

concurrency:
  group: auto-pr-from-issues
  cancel-in-progress: false

jobs:
  analyze-and-create-pr:
    # Filter out bot loops, todo scanners, and maintainer bots to prevent infinite issue/PR spam
    if: |
      (github.event_name == 'workflow_dispatch') || (
        !contains(github.event.issue.user.login, 'bot') &&
        !contains(github.event.issue.user.login, 'automaintainer') &&
        !contains(github.event.issue.title, 'in main.js') &&
        !contains(github.event.issue.title, 'needs to be preserved') &&
        !contains(github.event.issue.title, 'TODO') &&
        !contains(github.event.issue.body, 'todo-hash')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Node.js dependencies
        run: |
          npm ci || npm install

      - name: Analyze issue and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python3 scripts/ai_issue_solver.py

      - name: Add issue author as contributor
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          node scripts/add-contributor.js
