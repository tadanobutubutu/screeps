name: AI Issue Resolver (Ultimate Resilience)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: |
      github.event.issue.pull_request == null && 
      (github.event_name == 'workflow_dispatch' || 
       contains(github.event.issue.labels.*.name, 'ai-solve') ||
       contains(github.event.comment.body, '@ai solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴を取得

      - name: AI Solve Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          echo "🤖 Starting AI Issue Resolution Process..."
          
          # 1. Issueの情報と全コメントを取得
          ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body,comments)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          COMMENTS=$(echo "$ISSUE_DATA" | jq -r '.comments[].body')
          
          echo "📌 Issue #$ISSUE_NUMBER: $TITLE"

          # 2. 関連ファイルの検索 (Keyword Search)
          KEYWORDS=$(echo "$TITLE $BODY" | tr -c '[:alnum:]' ' ' | tr '[:upper:]' '[:lower:]' | xargs -n1 | grep -vE '^(the|and|is|to|in|at|of|please|add|create)$' | sort -u | head -n 5)
          echo "🔍 Searching for keywords: $KEYWORDS"
          SEARCH_RESULTS=""
          for kw in $KEYWORDS; do
            [ ${#kw} -lt 3 ] && continue
            FILES=$(grep -rl "$kw" . --exclude-dir=".git" --exclude-dir="node_modules" | head -n 3)
            for f in $FILES; do
              SEARCH_RESULTS="$SEARCH_RESULTS\n\n--- File: $f ---\n$(head -n 50 "$f")"
            done
          done

          # 3. AIプロンプトの構築 (より詳細な文脈を付与)
          PROMPT="You are a world-class AI developer. Solve this GitHub Issue.
          
          Issue: #$ISSUE_NUMBER
          Title: $TITLE
          Body: $BODY
          Comments: $COMMENTS
          
          Context from Codebase (Sample):
          $SEARCH_RESULTS
          
          Instructions:
          - Propose a fix by creating/modifying files.
          - Respond ONLY with a valid JSON array of objects: [{\"path\": \"filepath\", \"content\": \"full_content\"}]
          - Do not use markdown blocks.
          - If you cannot solve it, return an empty array []."

          RESOLVED_JSON=""
          
          # AI Provider Strategy 1: Gemini Direct (Fixed Endpoint)
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "☁️ Calling Gemini API..."
            RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{ \"contents\": [{\"parts\": [{\"text\": $(jq -Rs . <<< "$PROMPT")}]}] }")
            RESOLVED_JSON=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")
          fi
          
          # AI Provider Strategy 2: OpenRouter (Gemma 2 9B FREE)
          if [ -z "$RESOLVED_JSON" ] || [ "$RESOLVED_JSON" = "null" ] || [ "$RESOLVED_JSON" = "" ]; then
             if [ -n "$OPENROUTER_TOKEN" ]; then
                echo "☁️ Calling OpenRouter (Gemma 2 Free)..."
                RES=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                  -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg p "$PROMPT" '{model: "google/gemma-2-9b-it:free", messages: [{role: "user", content: $p}]}')")
                RESOLVED_JSON=$(echo "$RES" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
             fi
          fi

          # AI Provider Strategy 3: Pollinations AI (POST / Simple)
          if [ -z "$RESOLVED_JSON" ] || [ "$RESOLVED_JSON" = "null" ] || [ "$RESOLVED_JSON" = "" ]; then
            echo "☁️ Calling Pollinations AI..."
            RESOLVED_JSON=$(curl -s "https://text.pollinations.ai/$(jq -Rr @uri <<< "$PROMPT")?model=openai" || echo "[]")
          fi
          
          echo "📝 RAW AI Response Length: ${#RESOLVED_JSON}"
          
          # クリーンアップ
          CLEAN_JSON=$(echo "$RESOLVED_JSON" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```json/d' | sed '/^```/d' | tr -d '\r')
          
          # 4. 実行
          if echo "$CLEAN_JSON" | jq -e '. | is_array and length > 0' > /dev/null 2>&1; then
            BRANCH_NAME="ai-fix-$ISSUE_NUMBER-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            echo "$CLEAN_JSON" | jq -c '.[]' | while read -r change; do
              P=$(echo "$change" | jq -r '.path')
              C=$(echo "$change" | jq -r '.content')
              mkdir -p "$(dirname "$P")"
              echo "$C" > "$P"
              echo "✅ Modified $P"
            done
            
            git config user.name "AI Resolver"
            git config user.email "ai@screeps.local"
            git add .
            git commit -m "fix: AI resolution for #$ISSUE_NUMBER"
            git push origin "$BRANCH_NAME"
            
            gh pr create --title "AI Solution for #$ISSUE_NUMBER" \
                         --body "Automated fix for #$ISSUE_NUMBER. Closes #$ISSUE_NUMBER" \
                         --head "$BRANCH_NAME" --base main
            gh issue comment $ISSUE_NUMBER --body "🤖 AI has proposed a fix in a new PR. Check the linked PR above."
          else
            echo "⚠️ No valid fix generated."
            # マージ済みのPRやクローズ済みのIssueでなければコメント
            gh issue comment $ISSUE_NUMBER --body "🤖 AI could not generate an automated fix for this issue. Manual intervention required."
          fi
