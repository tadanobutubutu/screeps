name: AI Autocoder

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autocode:
    if: contains(github.event.comment.body, '/autocode') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Autocoder
        run: npm run ai:autocode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
