name: JAIPilot Generate

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Generation prompt'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JAIPilot
        run: npm run jaipilot:generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
