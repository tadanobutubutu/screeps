name: Auto Improve Screeps Code

on:
  schedule:
    # 毎日18:30 JST (= 09:30 UTC)
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    name: Generate improved code with OpenRouter and push to main

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check required files exist
        id: check_files
        run: |
          MISSING=false
          for f in main.js role.harvester.js role.upgrader.js role.builder.js role.repairer.js; do
            if [ ! -f "$f" ]; then
              echo "Warning: $f does not exist, skipping improvement"
              MISSING=true
            fi
          done
          echo "missing=$MISSING" >> $GITHUB_OUTPUT

      - name: Generate improved code with OpenRouter API
        if: steps.check_files.outputs.missing == 'false'
        env:
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          if (!process.env.OPENROUTER_TOKEN) {
            console.error('OPENROUTER_TOKEN secret is not set!');
            process.exit(1);
          }

          const currentMain      = fs.readFileSync('main.js', 'utf8');
          const currentHarvester = fs.readFileSync('role.harvester.js', 'utf8');
          const currentUpgrader  = fs.readFileSync('role.upgrader.js', 'utf8');
          const currentBuilder   = fs.readFileSync('role.builder.js', 'utf8');
          const currentRepairer  = fs.readFileSync('role.repairer.js', 'utf8');

          const prompt = 'You are an expert Screeps JavaScript AI developer. Improve the following Screeps bot code to make it more efficient and smarter. Apply one meaningful improvement (e.g. better energy management, smarter creep logic, better role balance, defense logic, or road building). Keep all existing functionality. Return ONLY valid JSON with this exact structure, no markdown, no explanation:{\"main\": \"<full main.js content>\",\"harvester\": \"<full role.harvester.js content>\",\"upgrader\": \"<full role.upgrader.js content>\",\"builder\": \"<full role.builder.js content>\",\"repairer\": \"<full role.repairer.js content>\"}\n\nCurrent main.js:\n' + currentMain + '\n\nCurrent role.harvester.js:\n' + currentHarvester + '\n\nCurrent role.upgrader.js:\n' + currentUpgrader + '\n\nCurrent role.builder.js:\n' + currentBuilder + '\n\nCurrent role.repairer.js:\n' + currentRepairer;

          const body = JSON.stringify({
            model: 'anthropic/claude-3.5-sonnet',
            max_tokens: 8192,
            messages: [{ role: 'user', content: prompt }]
          });

          const options = {
            hostname: 'openrouter.ai',
            path: '/api/v1/chat/completions',
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.OPENROUTER_TOKEN,
              'Content-Type': 'application/json',
              'X-Title': 'screeps-auto-improve',
              'Content-Length': Buffer.byteLength(body)
            }
          };

          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                const response = JSON.parse(data);
                if (!response.choices || !response.choices[0]) {
                  console.error('No choices in response:', JSON.stringify(response).substring(0, 500));
                  process.exit(1);
                }
                const text = response.choices[0].message.content;
                const cleaned = text.replace(/\`\`\`json\n?/g, '').replace(/\`\`\`\n?/g, '').trim();
                const improved = JSON.parse(cleaned);
                if (!improved.main || !improved.harvester || !improved.upgrader || !improved.builder || !improved.repairer) {
                  console.error('Response missing required keys:', Object.keys(improved));
                  process.exit(1);
                }
                fs.writeFileSync('main.js', improved.main);
                fs.writeFileSync('role.harvester.js', improved.harvester);
                fs.writeFileSync('role.upgrader.js', improved.upgrader);
                fs.writeFileSync('role.builder.js', improved.builder);
                fs.writeFileSync('role.repairer.js', improved.repairer);
                console.log('Code improved successfully!');
              } catch(e) {
                console.error('Failed to parse response:', e.message);
                console.error('Raw response:', data.substring(0, 1000));
                process.exit(1);
              }
            });
          });
          req.on('error', e => { console.error('Request error:', e.message); process.exit(1); });
          req.write(body);
          req.end();
          "

      - name: Commit and push directly to main
        if: steps.check_files.outputs.missing == 'false'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add main.js role.harvester.js role.upgrader.js role.builder.js role.repairer.js
          git diff --staged --quiet || git commit -m "🤖 auto-improve: daily OpenRouter optimization $(date +'%Y-%m-%d')"
          git push

      - name: Deploy to Screeps
        if: steps.check_files.outputs.missing == 'false'
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_PROD_TOKEN: ${{ secrets.SCREEPS_PROD_TOKEN }}
        run: node deploy.js
