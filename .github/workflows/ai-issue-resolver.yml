name: AI Issue Resolver (Ultimate Resilience)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: |
      github.event.issue.pull_request == null && 
      (github.event_name == 'workflow_dispatch' || 
       contains(github.event.issue.labels.*.name, 'ai-solve') ||
       contains(github.event.comment.body, '@ai solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Solve Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          echo "🤖 Starting AI Issue Resolution..."
          
          # 1. Fetch Context
          ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body,comments)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          COMMENTS=$(echo "$ISSUE_DATA" | jq -r '.comments[].body')
          FILES=$(find . -maxdepth 2 -not -path '*/.*' | head -n 20)
          
          # 2. Build Prompt
          PROMPT="Solve this GitHub Issue.
          Title: $TITLE
          Body: $BODY
          Comments: $COMMENTS
          Files: $FILES
          
          Respond ONLY with a JSON array: [{\"path\": \"file\", \"content\": \"full content\"}]
          No markdown. No explanation."

          RESOLVED=""
          
          # Strategy 1: Gemini Direct (v1beta with corrected ID)
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "☁️ Trying Gemini API (v1beta)..."
            # Try multiple model IDs
            for model in "gemini-1.5-flash" "gemini-pro"; do
              RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$GEMINI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{ \"contents\": [{\"parts\": [{\"text\": $(jq -Rs . <<< "$PROMPT")}]}] }")
              RESOLVED=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")
              [ -n "$RESOLVED" ] && [ "$RESOLVED" != "null" ] && break
            done
          fi
          
          # Strategy 2: OpenRouter (Known Free Models)
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ]; then
            if [ -n "$OPENROUTER_TOKEN" ]; then
              echo "☁️ Trying OpenRouter (Multi-model)..."
              for model in "meta-llama/llama-3-8b-instruct:free" "mistralai/mistral-7b-instruct:free" "google/gemma-2-9b-it:free"; do
                RES=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                  -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg m "$model" --arg p "$PROMPT" '{model: $m, messages: [{role: "user", content: $p}]}')")
                RESOLVED=$(echo "$RES" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
                [ -n "$RESOLVED" ] && [ "$RESOLVED" != "null" ] && break
              done
            fi
          fi

          # Strategy 3: Pollinations AI (Retry Mechanism)
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ] || [ "$RESOLVED" = "" ]; then
            echo "☁️ Trying Pollinations AI (with retries)..."
            for i in {1..3}; do
              RESOLVED=$(curl -s "https://text.pollinations.ai/$(jq -Rr @uri <<< "$PROMPT")?model=openai" || echo "")
              if [ -n "$RESOLVED" ] && [[ "$RESOLVED" != *"Queue full"* ]]; then
                break
              fi
              echo "⏳ Queue full, retrying in 5s..."
              sleep 5
            done
          fi
          
          # Clean JSON
          CLEAN=$(echo "$RESOLVED" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```json/d' | sed '/^```/d' | tr -d '\r')
          echo "📝 FINAL JSON: $CLEAN"

          # 3. Apply
          if echo "$CLEAN" | jq -e '. | is_array and length > 0' > /dev/null 2>&1; then
            BRANCH="ai-fix-$ISSUE_NUMBER-$(date +%s)"
            git checkout -b "$BRANCH"
            echo "$CLEAN" | jq -c '.[]' | while read -r change; do
              P=$(echo "$change" | jq -r '.path')
              C=$(echo "$change" | jq -r '.content')
              mkdir -p "$(dirname "$P")"
              echo "$C" > "$P"
            done
            git config user.name "AI Resolver"
            git config user.email "ai@screeps.local"
            git add .
            git commit -m "fix: AI resolution for #$ISSUE_NUMBER"
            git push origin "$BRANCH"
            gh pr create --title "AI Solution for #$ISSUE_NUMBER" --body "Closes #$ISSUE_NUMBER" --head "$BRANCH" --base main
            gh issue comment $ISSUE_NUMBER --body "🤖 AI fix proposed in new PR. Check above."
          else
            echo "❌ Failed to generate fix."
            gh issue comment $ISSUE_NUMBER --body "🤖 AI could not solve this automatically. All providers failed or returned invalid data."
          fi
