name: 🛡️ SonarCloud Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test
        run: pnpm test -- --coverage --coverageReporters=lcov --passWithNoTests
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Report Issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          script: |
            const org = process.env.SONAR_ORGANIZATION;
            const projectKey = `${org}:screeps`;
            const response = await fetch(`https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&resolved=false&severities=CRITICAL,MAJOR`, {
              headers: { 'Authorization': `Bearer ${process.env.SONAR_TOKEN}` }
            });
            const data = await response.json();
            const issues = data.issues || [];
            if (issues.length === 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🛡️ SonarCloud: ${issues.length}件の品質問題を修正してください`,
              body: `検出された問題の詳細は SonarCloud を確認してください。\n\n---\n**Auto-generated**`,
              labels: ['sonarcloud', 'bug', 'automated']
            });
