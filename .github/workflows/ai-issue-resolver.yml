name: AI Issue Resolver (Ultimate Resilience)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: |
      github.event.issue.pull_request == null && 
      (github.event_name == 'workflow_dispatch' || 
       contains(github.event.issue.labels.*.name, 'ai-solve') ||
       contains(github.event.comment.body, '@ai solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Solve Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          echo "🤖 Starting AI Issue Resolution..."
          
          # 1. Fetch Issue Context
          ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body,comments)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          COMMENTS=$(echo "$ISSUE_DATA" | jq -r '.comments[].body')
          
          # 2. File Context
          FILES=$(find . -maxdepth 2 -not -path '*/.*' | head -n 20)
          
          # 3. Build Prompt
          PROMPT="Solve this GitHub Issue.
          Title: $TITLE
          Body: $BODY
          Comments: $COMMENTS
          Files: $FILES
          
          Respond ONLY with a JSON array of changes: [{\"path\": \"file\", \"content\": \"full content\"}]
          No markdown. No explanation. If unsure, return []"

          RESOLVED=""
          
          # Provider 1: Gemini Direct (v1)
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "☁️ Trying Gemini API..."
            RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{ \"contents\": [{\"parts\": [{\"text\": $(jq -Rs . <<< "$PROMPT")}]}] }")
            RESOLVED=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")
            [ -n "$RESOLVED" ] && echo "✅ Gemini responded."
          fi
          
          # Provider 2: OpenRouter (Fallback to known free model)
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ]; then
            if [ -n "$OPENROUTER_TOKEN" ]; then
              echo "☁️ Trying OpenRouter (Gemma 2 9B)..."
              RES=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg p "$PROMPT" '{model: "google/gemma-2-9b-it:free", messages: [{role: "user", content: $p}]}')")
              RESOLVED=$(echo "$RES" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
              [ -n "$RESOLVED" ] && [ "$RESOLVED" != "null" ] && echo "✅ OpenRouter responded."
            fi
          fi

          # Provider 3: Pollinations AI (Absolute Fallback)
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ] || [ "$RESOLVED" = "" ]; then
            echo "☁️ Trying Pollinations AI..."
            # Simple GET request
            ENCODED_PROMPT=$(jq -Rr @uri <<< "$PROMPT")
            RESOLVED=$(curl -s "https://text.pollinations.ai/$ENCODED_PROMPT?model=openai" || echo "[]")
            [ -n "$RESOLVED" ] && echo "✅ Pollinations responded."
          fi
          
          # Clean JSON
          CLEAN=$(echo "$RESOLVED" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```json/d' | sed '/^```/d' | tr -d '\r')
          echo "📝 FINAL JSON: $CLEAN"

          # 4. Apply and PR
          if echo "$CLEAN" | jq -e '. | is_array and length > 0' > /dev/null 2>&1; then
            BRANCH="ai-fix-$ISSUE_NUMBER-$(date +%s)"
            git checkout -b "$BRANCH"
            echo "$CLEAN" | jq -c '.[]' | while read -r change; do
              P=$(echo "$change" | jq -r '.path')
              C=$(echo "$change" | jq -r '.content')
              mkdir -p "$(dirname "$P")"
              echo "$C" > "$P"
            done
            git config user.name "AI Resolver"
            git config user.email "ai@screeps.local"
            git add .
            git commit -m "fix: AI auto-resolve #$ISSUE_NUMBER"
            git push origin "$BRANCH"
            gh pr create --title "AI Fix for #$ISSUE_NUMBER" --body "Closes #$ISSUE_NUMBER" --head "$BRANCH" --base main
            gh issue comment $ISSUE_NUMBER --body "🤖 AI fix proposed in linked PR."
          else
            echo "❌ No fix generated."
            gh issue comment $ISSUE_NUMBER --body "🤖 AI could not solve this automatically."
          fi
