name: 🔖 Auto Zenodo DOI Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Auto Improve Screeps Code"
      - "🔧 Rule-Based Auto-Improve"
    types: [completed]
    branches: [main]
  schedule:
    # 毎週月曜日 00:00 UTC (JST 09:00) に定期スナップショット
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual release reason'
        required: false
        default: 'Manual Zenodo snapshot'

# GITHUB_TOKEN に最小限の権限のみ付与
permissions:
  contents: write

jobs:
  zenodo-release:
    runs-on: ubuntu-latest
    name: Create Zenodo DOI Snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 直前のリリースから変更がなければスキップ（pushトリガー時のみ）
      - name: Check for changes since last release
        id: check_changes
        run: |
          LAST_TAG=$(git tag --sort=-creatordate | grep '^zenodo-' | head -n1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "No previous zenodo tag found, will create first release."
          else
            DIFF=$(git diff --name-only "$LAST_TAG" HEAD -- . ':!.github' | wc -l)
            if [ "$DIFF" -gt 0 ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "$DIFF files changed since $LAST_TAG"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No source changes since $LAST_TAG, skipping."
            fi
          fi

      - name: Create Zenodo snapshot release
        if: steps.check_changes.outputs.changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const date = now.toISOString().slice(0, 10).replace(/-/g, '.');
            const time = now.toISOString().slice(11, 16).replace(':', '');
            const trigger = context.eventName;
            const run = context.runNumber;

            // トリガー種別をタグに含める
            const triggerLabel = trigger === 'schedule' ? 'weekly' : trigger === 'workflow_dispatch' ? 'manual' : trigger === 'workflow_run' ? 'ai-push' : 'push';
            const tag = `zenodo-${date}-${time}-${triggerLabel}-${run}`;

            // タグ作成
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });

            // リリース作成（prerelease=true で "Latest" に表示されない）
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `[Zenodo DOI only] ${date} ${triggerLabel} #${run}`,
              body: [
                '## ⚠️ このリリースは一般利用向けではありません',
                '',
                'This release is **auto-generated solely for Zenodo DOI archiving**.',
                'It is a personal Screeps game bot experiment and is NOT intended for general use.',
                '',
                `- Trigger: \`${trigger}\``,
                `- Commit: \`${context.sha.slice(0, 7)}\``,
                `- Run: #${run}`,
                '',
                '---',
                '_If you found this repo: this is just a private Screeps bot. Nothing useful to download here!_'
              ].join('\n'),
              prerelease: true,
              make_latest: 'false'
            });

            console.log(`✅ Created release: ${tag}`);
