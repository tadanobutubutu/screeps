name: AI Conflict Resolver (Ultimate)

on:
  pull_request:
    types: [synchronize, opened, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Conflict Resolution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Starting AI Conflict Resolution Process (Gemini)..."
          
          # 1. コンフリクトしているPRの一覧を取得 (GraphQL)
          QUERY='query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              pullRequests(states: OPEN, first: 20) {
                nodes {
                  number
                  mergeable
                  headRefName
                  baseRefName
                }
              }
            }
          }'
          OWNER=$(echo $REPO | cut -d/ -f1)
          NAME=$(echo $REPO | cut -d/ -f2)
          echo "📊 Fetching PRs for $OWNER/$NAME..."
          PR_DATA=$(gh api graphql -f query="$QUERY" -f owner="$OWNER" -f repo="$NAME")
          
          if [ -z "$PR_DATA" ]; then
            echo "❌ Failed to fetch PR data."
            exit 1
          fi
          
          # 2. CONFLICTING な PR に対して処理を実行
          echo "🔍 Filtering for CONFLICTING PRs..."
          echo "$PR_DATA" | jq -c '.data.repository.pullRequests.nodes[] | select(.mergeable == "CONFLICTING")' | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r '.number')
            HEAD=$(echo "$pr" | jq -r '.headRefName')
            BASE=$(echo "$pr" | jq -r '.baseRefName')
            
            echo "----------------------------------------"
            echo "🛠️ PR #$PR_NO ($HEAD -> $BASE) has conflicts. Resolving..."
            
            # ブランチをチェックアウト
            git checkout "$HEAD"
            git config user.name "AI Conflict Resolver"
            git config user.email "ai-resolver@screeps.local"
            
            # main をマージしてコンフリクトマーカーを発生させる
            git fetch origin "$BASE"
            if git merge "origin/$BASE"; then
              echo "✅ Auto-merge succeeded without AI."
              git push origin "$HEAD"
              continue
            fi
            
            # コンフリクトしているファイルを取得
            FILES=$(git diff --name-only --diff-filter=U)
            for FILE in $FILES; do
              echo "🤖 AI resolving conflicts in $FILE..."
              CONTENT=$(cat "$FILE")
              
              # Gemini 1.5 Flash API 呼び出し
              RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg content "$CONTENT" --arg file "$FILE" \
                  '{
                    contents: [{
                      parts: [{
                        text: ("You are an expert developer. Resolve merge conflicts in the provided file. Remove all markers (<<<<<<<, =======, >>>>>>>) and integrate changes logically. Return ONLY the full file content without backticks or markdown formatting.\n\nFile: " + $file + "\n\n" + $content)
                      }]
                    }],
                    generationConfig: {
                      temperature: 0.1
                    }
                  }')")
              
              RESOLVED_CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
              
              if [ "$RESOLVED_CONTENT" != "null" ] && [ -n "$RESOLVED_CONTENT" ]; then
                # backticks を削除 (Geminiがつけてしまった場合用)
                CLEAN_CONTENT=$(echo "$RESOLVED_CONTENT" | sed '1{/^```/d;};${/^```/d;}')
                echo "$CLEAN_CONTENT" > "$FILE"
                git add "$FILE"
                echo "✅ $FILE resolved."
              else
                echo "❌ AI failed to resolve $FILE. Response: $RESPONSE"
                exit 1
              fi
            done
            
            # 解決した内容をコミットしてプッシュ
            git commit -m "chore: Auto-resolve merge conflicts via AI (Gemini 1.5)"
            git push origin "$HEAD"
            echo "🚀 Pushed resolution for PR #$PR_NO"
          done
