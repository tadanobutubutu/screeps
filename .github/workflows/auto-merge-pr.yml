name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # auto-fixボット由来のPRのみ自動マージ（手動レビューPRは対象外）
    if: |
      startsWith(github.head_ref, 'auto-fix/') ||
      startsWith(github.head_ref, 'renovate/')
    steps:
      - name: Auto merge bot PRs only
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            console.log(`Auto-merging bot PR #${pr.number}: ${pr.title}`);

            // チェックが登録されるまで少し待つ
            await new Promise(resolve => setTimeout(resolve, 5000));

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: pr.title,
                commit_message: `Auto-merged bot PR #${pr.number}\n\n${(pr.body || '').slice(0, 500)}`,
              });
              console.log(`✅ Merged PR #${pr.number}`);
            } catch (error) {
              console.log(`⚠️ Could not auto-merge PR #${pr.number}: ${error.message}`);
              if (error.message.includes('conflict') || error.message.includes('merge')) {
                try {
                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                  });
                  console.log('Branch updated, will retry on next push event');
                } catch (updateError) {
                  console.log(`Could not update branch: ${updateError.message}`);
                }
              }
            }
