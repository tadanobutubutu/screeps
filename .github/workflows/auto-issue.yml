name: Auto Issue

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  auto-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Weekly Report Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = `Weekly Quality Report - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Weekly Quality Report\n\nAutomated quality metrics for the week.\n\n- Test coverage: TBD\n- Code quality score: TBD\n- Open issues: TBD\n- PRs merged: TBD`;
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'weekly-report'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['weekly-report', 'automation']
              });
            }
