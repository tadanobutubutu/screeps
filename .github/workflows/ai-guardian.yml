name: AI Guardian

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Guardian
        run: npm run ai:guardian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
