name: Auto Merge PRs - Force Penetration (Instant CI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # 毎時

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  force-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token (Optional)
        id: generate_token
        continue-on-error: true
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.AUTO_MERGE_APP_ID }}
          private_key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: High-Speed Penetration Merge
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          # 全てのオープンなPRを取得
          pull_requests=$(gh pr list --json number,isDraft,id,author,mergeable --limit 100)
          
          echo "$pull_requests" | jq -c ".[]" | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r ".number")
            PR_ID=$(echo "$pr" | jq -r ".id")
            IS_DRAFT=$(echo "$pr" | jq -r ".isDraft")
            AUTHOR=$(echo "$pr" | jq -r ".author.login")
            MERGEABLE=$(echo "$pr" | jq -r ".mergeable")
            
            # ai-cooking-recipes 用のユーザー制限
            if [[ "${{ github.repository }}" == *"ai-cooking-recipes"* ]]; then
              if [[ ! "$AUTHOR" =~ ^(tadanobutubutu|jules|devin)$ ]]; then
                echo "⏭️ Skipping PR #$PR_NO by $AUTHOR (Unauthorized)"
                continue
              fi
            fi

            echo "🚀 Processing PR #$PR_NO by $AUTHOR (Status: $MERGEABLE)..."
            
            # Draft解除
            if [ "$IS_DRAFT" = "true" ]; then
              echo "📝 PR #$PR_NO is draft, converting..."
              gh pr ready "$PR_NO" || true
            fi
            
            # コンフリクト自動更新
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "⚠️ PR #$PR_NO has conflicts, attempting branch refresh..."
              gh pr update-branch "$PR_NO" || true
              sleep 2
            fi

            # 管理者権限で強制マージ (ブランチ自動削除 --delete-branch を明示)
            if gh pr merge "$PR_NO" --admin --squash --delete-branch; then
              echo "✅ Successfully merged PR #$PR_NO and deleted branch."
            else
              echo "⚠️ Merge failed, trying final GraphQL bypass..."
              gh api graphql -f query='
                mutation($id: ID!) {
                  mergePullRequest(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) { clientMutationId }
                }' -f id="$PR_ID" || echo "❌ Failed to merge PR #$PR_NO"
            fi
          done
