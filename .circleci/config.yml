version: 2.1

jobs:
  noop:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: No-op
          command: echo "CircleCI is configured. No CI tasks defined yet."

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Deploy marker
          command: echo "Deploy completed."

  build:
    docker:
      - image: cimg/base:current
    resource_class: tadanobutubutu/screeps-runner
    steps:
      - run: echo "Hi I'm on a Container Runner!"

workflows:
  ci:
    jobs:
      - noop
      - deploy:
          requires:
            - noop
          filters:
            branches:
              only: main

  build-workflow:
    jobs:
      - build
