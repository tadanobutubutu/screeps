# PR Labeler configuration - automatically label PRs based on file changes

documentation:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.md'
    - 'docs/**/*'
    - 'wiki/**/*'

github-actions:
- changed-files:
  - any-glob-to-any-file:
    - '.github/workflows/**/*'
    - '.github/actions/**/*'

dependencies:
- changed-files:
  - any-glob-to-any-file:
    - 'package.json'
    - 'package-lock.json'
    - 'yarn.lock'
    - 'pnpm-lock.yaml'

javascript:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.js'
    - '**/*.mjs'
    - '**/*.cjs'

config:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.json'
    - '**/*.yml'
    - '**/*.yaml'
    - '**/*.toml'
    - '.gitignore'
    - '.gitattributes'

test:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.test.js'
    - '**/*.spec.js'
    - 'test/**/*'
    - 'tests/**/*'

ci:
- changed-files:
  - any-glob-to-any-file:
    - '.github/**/*'
    - '.gitlab-ci.yml'
    - '.circleci/**/*'
    - 'azure-pipelines.yml'

security:
- changed-files:
  - any-glob-to-any-file:
    - 'SECURITY.md'
    - '.github/workflows/codeql.yml'
    - '.github/workflows/secret-scanning.yml'
    - '.gitleaks.toml'

bot:
- changed-files:
  - any-glob-to-any-file:
    - '.github/dependabot.yml'
    - '.github/renovate.json'
    - '.github/mergify.yml'
    - '.all-contributorsrc'
