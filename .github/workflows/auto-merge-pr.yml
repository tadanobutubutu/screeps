name: Auto Merge PRs - High Penetration (App Auth)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  workflows: write

jobs:
  force-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.AUTO_MERGE_APP_ID }}
          private_key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: High-Penetration Merge Logic
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          # 全てのオープンなPRを取得
          pull_requests=$(gh pr list --repo ${{ github.repository }} --json number,isDraft,id,author,mergeable -L 100)
          
          echo "$pull_requests" | jq -c ".[]" | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r ".number")
            PR_ID=$(echo "$pr" | jq -r ".id")
            IS_DRAFT=$(echo "$pr" | jq -r ".isDraft")
            AUTHOR=$(echo "$pr" | jq -r ".author.login")
            MERGEABLE=$(echo "$pr" | jq -r ".mergeable")
            
            # リポジトリごとのユーザーフィルター (ai-cooking-recipes の場合)
            if [[ "${{ github.repository }}" == *"ai-cooking-recipes"* ]]; then
              if [[ ! "$AUTHOR" =~ ^(tadanobutubutu|jules|devin)$ ]]; then
                echo "⏭️ Skipping PR #$PR_NO by $AUTHOR (Unauthorized)"
                continue
              fi
            fi

            echo "🚀 Processing PR #$PR_NO by $AUTHOR (Mergeable: $MERGEABLE)..."
            
            # 1. Draft解除
            if [ "$IS_DRAFT" = "true" ]; then
              echo "📝 PR #$PR_NO is draft, converting to ready..."
              gh pr ready "$PR_NO" --repo ${{ github.repository }} || true
            fi
            
            # 2. コンフリクト解消の試行
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "⚠️ PR #$PR_NO has conflicts. Attempting to refresh..."
              gh pr update-branch "$PR_NO" --repo ${{ github.repository }} || true
            fi

            # 3. マージ試行 (管理者権限でバイパス)
            if gh pr merge "$PR_NO" --repo ${{ github.repository }} --admin --squash --delete-branch; then
              echo "✅ Successfully merged PR #$PR_NO"
            else
              echo "⚠️ Initial merge failed, attempting GraphQL force merge..."
              gh api graphql -f query='
                mutation($id: ID!) {
                  mergePullRequest(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) { clientMutationId }
                }' -f id="$PR_ID" || echo "❌ Could not merge PR #$PR_NO"
            fi
          done
