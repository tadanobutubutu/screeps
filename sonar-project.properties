# SonarCloud project configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=tadanobutubutu_screeps
sonar.organization=tadanobutubutu

# Project metadata
sonar.projectName=screeps
sonar.projectVersion=1.0

# Source settings
# This is a JavaScript/Node.js project (Screeps game AI)
sonar.sources=.
sonar.exclusions=node_modules/**,**/*.test.js,.github/**

# Language settings
# Primary language is JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python version (suppress warning - Python files are workflow scripts only)
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8
