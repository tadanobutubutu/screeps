name: AI Sentinel (Ultimate Security & Quality Shield)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write # Needed for CodeQL/Gitleaks SARIF

jobs:
  security-scan:
    name: 🛡️ Security & Quality Deep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for Gitleaks

      # 1. Gitleaks: Secret Scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        id: gitleaks
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Secret Leaks
        if: steps.gitleaks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: Hardcoded Secrets Detected in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: Hardcoded Secrets Detected" --body "Gitleaks has detected potential secret leaks in the repository. Please redact them immediately to prevent security breach." --label "ai-solve,security" || true
          fi

      # 2. SonarCloud: Quality Gate & Security Analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        id: sonar
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report SonarCloud Issues
        if: steps.sonar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: SonarCloud Quality Gate Failed in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: SonarCloud Quality Gate Failed" --body "SonarCloud quality gate has failed. This indicates technical debt, code smells, or security vulnerabilities that need addressing." --label "ai-solve,enhancement" || true
          fi

      # 3. OSV-Scanner: Dependency Vulnerabilities (Google)
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-with-bash@main
        id: osv
        continue-on-error: true

      - name: Report Dependency Vulnerabilities
        if: steps.osv.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: Dependency Vulnerabilities Detected (OSV) in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: Dependency Vulnerabilities Detected (OSV)" --body "OSV-Scanner detected known vulnerabilities in your project dependencies. Please update them to the latest secure versions." --label "ai-solve,security" || true
          fi

      # 4. Trivy: File System & Config Scan (Aqua Security)
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        id: trivy
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Report Trivy Findings
        if: steps.trivy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: Security Issues Detected by Trivy in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: Security Issues Detected by Trivy" --body "Trivy detected critical or high-severity security issues in the filesystem or configurations." --label "ai-solve,security" || true
          fi

      # 5. CodeQL: GitHub Native Security Analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        id: codeql
        continue-on-error: true

      - name: Report CodeQL Findings
        if: steps.codeql.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: CodeQL Security Scan Failed in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: CodeQL Security Scan Failed" --body "GitHub CodeQL analysis failed or found significant security patterns that require review." --label "ai-solve,security" || true
          fi

  quality-scan:
    name: 🧪 Quality & Coverage Deep Dive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      # Linting
      - name: Run ESLint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Report Lint Failures
        if: steps.lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: Linting Violations Detected in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: Linting Violations Detected" --body "ESLint found code style or quality violations. Maintaining clean code is essential for AI-driven development." --label "ai-solve,bug" || true
          fi

      # Testing & Coverage
      - name: Run Tests with Coverage
        id: test
        run: pnpm test:coverage
        continue-on-error: true

      - name: Report Test Failures
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "🚨 Sentinel: Unit Test Failures Detected in:title" --state open --json number | jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "🚨 Sentinel: Unit Test Failures Detected" --body "One or more unit tests failed. Please ensure the engine remains stable." --label "ai-solve,bug" || true
          fi
