name: Validate Package Versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate root package.json
        id: validate-root
        run: |
          echo "## Validating root package.json" >> $GITHUB_STEP_SUMMARY
          
          INVALID_PACKAGES=()
          
          for pkg in $(node -e "
            const pkg = require('./package.json');
            const deps = {...pkg.dependencies, ...pkg.devDependencies};
            Object.entries(deps).forEach(([name, ver]) => console.log(name + '|' + ver));
          "); do
            NAME=$(echo "$pkg" | cut -d'|' -f1)
            VERSION=$(echo "$pkg" | cut -d'|' -f2)
            
            if ! npm view "$NAME@$VERSION" version &>/dev/null; then
              echo "❌ $NAME@$VERSION does not exist in npm registry" >> $GITHUB_STEP_SUMMARY
              LATEST=$(npm view "$NAME" version 2>/dev/null || echo "unknown")
              INVALID_PACKAGES+=("$NAME|$VERSION|$LATEST")
            else
              echo "✅ $NAME@$VERSION" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ ${#INVALID_PACKAGES[@]} -gt 0 ]; then
            echo "invalid_packages=${INVALID_PACKAGES[*]}" >> $GITHUB_OUTPUT
          fi
          echo "validation_complete=true" >> $GITHUB_OUTPUT

      - name: Validate dashboard/package.json
        id: validate-dashboard
        run: |
          echo "## Validating dashboard/package.json" >> $GITHUB_STEP_SUMMARY
          
          INVALID_PACKAGES=()
          
          for pkg in $(node -e "
            const pkg = require('./dashboard/package.json');
            const deps = {...pkg.dependencies, ...pkg.devDependencies};
            Object.entries(deps).forEach(([name, ver]) => console.log(name + '|' + ver));
          "); do
            NAME=$(echo "$pkg" | cut -d'|' -f1)
            VERSION=$(echo "$pkg" | cut -d'|' -f2)
            
            if ! npm view "$NAME@$VERSION" version &>/dev/null; then
              echo "❌ $NAME@$VERSION does not exist in npm registry" >> $GITHUB_STEP_SUMMARY
              LATEST=$(npm view "$NAME" version 2>/dev/null || echo "unknown")
              INVALID_PACKAGES+=("$NAME|$VERSION|$LATEST")
            else
              echo "✅ $NAME@$VERSION" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ ${#INVALID_PACKAGES[@]} -gt 0 ]; then
            echo "invalid_packages=${INVALID_PACKAGES[*]}" >> $GITHUB_OUTPUT
          fi
          echo "validation_complete=true" >> $GITHUB_OUTPUT

      - name: Post PR comment on pull request
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=$(echo $GITHUB_REF | grep -oP '(?<=refs\/pull\/)\d+')
          INVALID_ROOT=$(echo "${{ steps.validate-root.outputs.invalid_packages }}" 2>/dev/null || echo "")
          INVALID_DASHBOARD=$(echo "${{ steps.validate-dashboard.outputs.invalid_packages }}" 2>/dev/null || echo "")
          
          HAS_INVALID="false"
          
          if [ -n "$INVALID_ROOT" ] || [ -n "$INVALID_DASHBOARD" ]; then
            HAS_INVALID="true"
          fi
          
          if [ "$HAS_INVALID" == "true" ]; then
            COMMENT_BODY="## ⚠️ Invalid Package Versions Detected\n\n"
            COMMENT_BODY+="This PR contains invalid package versions. It can be merged as-is.\n"
            COMMENT_BODY+="An auto-fix PR will be created after merging to main.\n\n"
            COMMENT_BODY+="| Package | Invalid Version | Recommended |\n"
            COMMENT_BODY+="|---------|----------------|-------------|\n"
            
            if [ -n "$INVALID_ROOT" ]; then
              for pkg in $INVALID_ROOT; do
                NAME=$(echo "$pkg" | cut -d'|' -f1)
                VERSION=$(echo "$pkg" | cut -d'|' -f2)
                LATEST=$(echo "$pkg" | cut -d'|' -f3)
                COMMENT_BODY+="| \`$NAME\` (root) | \`$VERSION\` | \`$LATEST\` |\n"
              done
            fi
            
            if [ -n "$INVALID_DASHBOARD" ]; then
              for pkg in $INVALID_DASHBOARD; do
                NAME=$(echo "$pkg" | cut -d'|' -f1)
                VERSION=$(echo "$pkg" | cut -d'|' -f2)
                LATEST=$(echo "$pkg" | cut -d'|' -f3)
                COMMENT_BODY+="| \`$NAME\` (dashboard) | \`$VERSION\` | \`$LATEST\` |\n"
              done
            fi
          else
            COMMENT_BODY="## ✅ All Package Versions Valid\n\nAll package versions in this PR exist in the npm registry."
          fi
          
          gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-fix:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check if there are invalid packages
        id: check-invalid
        run: |
          INVALID_ROOT=$(echo "${{ steps.validate-root.outputs.invalid_packages }}" 2>/dev/null || echo "")
          INVALID_DASHBOARD=$(echo "${{ steps.validate-dashboard.outputs.invalid_packages }}" 2>/dev/null || echo "")
          
          if [ -n "$INVALID_ROOT" ] || [ -n "$INVALID_DASHBOARD" ]; then
            echo "has_invalid=true" >> $GITHUB_OUTPUT
          else
            echo "has_invalid=false" >> $GITHUB_OUTPUT
          fi

      - name: Fix root package.json
        if: steps.check-invalid.outputs.has_invalid == 'true'
        run: |
          for pkg in $(node -e "
            const pkg = require('./package.json');
            const deps = {...pkg.dependencies, ...pkg.devDependencies};
            Object.entries(deps).forEach(([name, ver]) => console.log(name + '|' + ver));
          "); do
            NAME=$(echo "$pkg" | cut -d'|' -f1)
            CURRENT_VER=$(echo "$pkg" | cut -d'|' -f2)
            
            if ! npm view "$NAME@$CURRENT_VER" version &>/dev/null; then
              LATEST=$(npm view "$NAME" version)
              echo "Fixing $NAME: $CURRENT_VER -> $LATEST"
              npm pkg set "dependencies.$NAME=$LATEST" 2>/dev/null || npm pkg set "devDependencies.$NAME=$LATEST"
            fi
          done

      - name: Fix dashboard/package.json
        if: steps.check-invalid.outputs.has_invalid == 'true'
        run: |
          cd dashboard
          for pkg in $(node -e "
            const pkg = require('./package.json');
            const deps = {...pkg.dependencies, ...pkg.devDependencies};
            Object.entries(deps).forEach(([name, ver]) => console.log(name + '|' + ver));
          "); do
            NAME=$(echo "$pkg" | cut -d'|' -f1)
            CURRENT_VER=$(echo "$pkg" | cut -d'|' -f2)
            
            if ! npm view "$NAME@$CURRENT_VER" version &>/dev/null; then
              LATEST=$(npm view "$NAME" version)
              echo "Fixing $NAME: $CURRENT_VER -> $LATEST"
              npm pkg set "dependencies.$NAME=$LATEST" 2>/dev/null || npm pkg set "devDependencies.$NAME=$LATEST"
            fi
          done

      - name: Create branch and PR
        if: steps.check-invalid.outputs.has_invalid == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git checkout -b fix/auto-correct-invalid-package-versions
          git add package.json dashboard/package.json
          git commit -m "fix: auto-correct invalid package versions"
          
          git push -u origin fix/auto-correct-invalid-package-versions || true
          
          gh pr create --title "fix: auto-correct invalid package versions in dashboard/package.json" \
            --body "This PR automatically corrects invalid package versions that do not exist in the npm registry." \
            --base main || true
