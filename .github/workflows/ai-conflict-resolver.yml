name: AI Conflict Resolver (Ultimate)

on:
  pull_request:
    types: [synchronize, opened, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Conflict Resolution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Starting AI Conflict Resolution Process..."
          
          # 1. オープンなPRの一覧を取得
          QUERY='query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              pullRequests(states: OPEN, first: 30) {
                nodes {
                  number
                  headRefName
                  baseRefName
                }
              }
            }
          }'
          OWNER=$(echo $REPO | cut -d/ -f1)
          NAME=$(echo $REPO | cut -d/ -f2)
          PR_DATA=$(gh api graphql -f query="$QUERY" -f owner="$OWNER" -f repo="$NAME")
          
          echo "✅ PR Data received."
          
          echo "$PR_DATA" | jq -c '.data.repository.pullRequests.nodes[]' | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r '.number')
            HEAD=$(echo "$pr" | jq -r '.headRefName')
            BASE=$(echo "$pr" | jq -r '.baseRefName')
            
            echo "----------------------------------------"
            echo "🔍 Checking PR #$PR_NO ($HEAD -> $BASE)..."
            
            git checkout "$HEAD"
            git config user.name "AI Conflict Resolver"
            git config user.email "ai-resolver@screeps.local"
            
            git fetch origin "$BASE"
            if git merge "origin/$BASE" --no-edit; then
              echo "✅ Merge succeeded automatically."
              git push origin "$HEAD" || true
              continue
            fi
            
            echo "⚠️ Conflict detected. Invoking AI..."
            
            FILES=$(git diff --name-only --diff-filter=U)
            for FILE in $FILES; do
              echo "🤖 AI resolving $FILE..."
              CONTENT=$(cat "$FILE")
              PROMPT="Resolve merge conflicts in this JavaScript/TypeScript file. Return ONLY the resolved content. No backticks or explanations. Integrate changes logically.\n\nFile: $FILE\n\nContent:\n$CONTENT"
              
              RESOLVED_CONTENT="null"
              
              # Try OpenRouter with various models (including FREE ones)
              if [ -n "$OPENROUTER_TOKEN" ]; then
                # 1. Try Claude 3.5 Sonnet
                echo "☁️ Trying OpenRouter (Claude 3.5 Sonnet)..."
                RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                  -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg p "$PROMPT" '{model: "anthropic/claude-3.5-sonnet", messages: [{role: "user", content: $p}]}')")
                RESOLVED_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null || echo "null")
                
                # 2. Try Llama 3 (FREE) as absolute fallback
                if [ "$RESOLVED_CONTENT" = "null" ]; then
                  echo "☁️ Trying OpenRouter (Llama 3 FREE fallback)..."
                  RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                    -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "$(jq -n --arg p "$PROMPT" '{model: "meta-llama/llama-3-8b-instruct:free", messages: [{role: "user", content: $p}]}')")
                  RESOLVED_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null || echo "null")
                fi
              fi
              
              if [ "$RESOLVED_CONTENT" != "null" ] && [ -n "$RESOLVED_CONTENT" ]; then
                CLEAN=$(echo "$RESOLVED_CONTENT" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```javascript/d' | sed '/^```js/d')
                echo "$CLEAN" > "$FILE"
                git add "$FILE"
                echo "✅ $FILE resolved."
              else
                echo "❌ All AI providers failed for $FILE. Full last response: $RESPONSE"
                git merge --abort
                continue 2
              fi
            done
            
            if git commit -m "chore: Auto-resolve merge conflicts via AI"; then
              git push origin "$HEAD"
              echo "🚀 PR #$PR_NO resolved and pushed."
            fi
          done
