name: Continuous Quality & Coverage Monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Health & Coverage Check
        id: health_check
        run: |
          node scripts/check_repo_health.js || echo "unhealthy=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report and Create Issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "repo-health-report.json" ]; then
            echo "Parsing repo-health-report.json..."
            
            # Loop through each issue in the JSON report
            jq -c '.issues[]' repo-health-report.json | while read -r issue; do
              TYPE=$(echo "$issue" | jq -r '.type')
              SEVERITY=$(echo "$issue" | jq -r '.severity')
              MSG=$(echo "$issue" | jq -r '.message')
              
              TITLE=""
              BODY=""
              LABEL="auto-fix"
              
              if [ "$TYPE" = "lint" ]; then
                FILE=$(echo "$issue" | jq -r '.file')
                LINE=$(echo "$issue" | jq -r '.line')
                RULE=$(echo "$issue" | jq -r '.ruleId')
                TITLE="Lint Error: Fix $RULE in $FILE"
                BODY="### Quality Linter Issue\n- **File:** $FILE\n- **Line:** $LINE\n- **Rule ID:** $RULE\n- **Message:** $MSG\n\nThis issue was automatically generated by the Continuous Quality Monitor. Please resolve it."
                LABEL="auto-fix,lint"
              elif [ "$TYPE" = "test_failure" ]; then
                SUITE=$(echo "$issue" | jq -r '.suite')
                TEST_TITLE=$(echo "$issue" | jq -r '.title')
                TITLE="Test Failure: $TEST_TITLE in $SUITE"
                BODY="### Test Failure Alert\n- **Suite:** $SUITE\n- **Test:** $TEST_TITLE\n\n**Error details:**\n\`\`\`\n$MSG\n\`\`\`\n\nPlease check the implementation and fix the failing test."
                LABEL="auto-fix,test-failure"
              elif [ "$TYPE" = "coverage_gap" ]; then
                FILE=$(echo "$issue" | jq -r '.file')
                ASPECT=$(echo "$issue" | jq -r '.aspect')
                PCT=$(echo "$issue" | jq -r '.pct')
                TITLE="Coverage Gap: Increase $ASPECT coverage in $FILE"
                BODY="### Code Coverage Gaps\n- **File:** $FILE\n- **Aspect:** $ASPECT\n- **Current Coverage:** $PCT%\n- **Target Coverage:** 100%\n\nThis file is missing tests. Please add test cases to cover statements, lines, or branches in this file."
                LABEL="auto-fix,coverage"
              else
                TITLE="Quality Monitor Alert: $MSG"
                BODY="$MSG"
              fi
              
              # Check for duplicates on open issues
              DUPLICATE=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number')
              if [ -n "$DUPLICATE" ]; then
                echo "⏭️ Duplicate issue #$DUPLICATE already exists for '$TITLE'. Skipping."
              else
                echo "Creating Issue: $TITLE"
                gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL"
              fi
            done
          else
            echo "Health check report not found!"
          fi
