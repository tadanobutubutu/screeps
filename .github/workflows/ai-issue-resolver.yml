name: AI Issue Resolver (Final Resilience)
on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  solve:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run AI Solver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number || '824' }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "$ISSUE_TITLE" ]; then
            DATA=$(gh issue view "$ISSUE_NUMBER" --json title,body)
            export ISSUE_TITLE=$(echo "$DATA" | jq -r '.title')
            export ISSUE_BODY=$(echo "$DATA" | jq -r '.body')
          fi
          python3 scripts/ai_issue_solver.py
