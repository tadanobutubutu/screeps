name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto merge PR (Force merge even with conflicts)
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            console.log(`Auto-merging PR #${pr.number}: ${pr.title}`);

            await new Promise(resolve => setTimeout(resolve, 3000));

            try {
              // First try normal merge
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: pr.title,
                commit_message: `Auto-merged PR #${pr.number}\n\n${(pr.body || '').slice(0, 500)}`,
              });
              console.log(`✅ Merged PR #${pr.number}`);
            } catch (error) {
              console.log(`⚠️ First merge attempt failed: ${error.message}`);
              
              // Force merge - update branch and merge
              try {
                // Update branch first
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                console.log('Branch updated, waiting for sync...');
                await new Promise(resolve => setTimeout(resolve, 5000));
                
                // Try merge again
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: pr.title,
                  commit_message: `Auto-merged PR #${pr.number}\n\n${(pr.body || '').slice(0, 500)}`,
                });
                console.log(`✅ Force merged PR #${pr.number}`);
              } catch (forceError) {
                console.log(`⚠️ Force merge also failed: ${forceError.message}`);
                // Last resort: use admin merge API with required status checks bypass
                try {
                  const mutation = `
                    mutation {
                      mergePullRequest(input: {
                        pullRequestId: "${pr.node_id}",
                        mergeMethod: SQUASH,
                        commitHeadline: "${pr.title.replace(/"/g, '\\"')}",
                        expectedHeadOid: "${pr.head.sha}"
                      }) {
                        clientMutationId
                      }
                    }
                  `;
                  const result = await github.graphql(mutation);
                  console.log(`✅ Merged via GraphQL API PR #${pr.number}`);
                } catch (graphqlError) {
                  console.log(`❌ All merge attempts failed for PR #${pr.number}: ${graphqlError.message}`);
                }
              }
            }
