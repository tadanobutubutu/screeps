name: ✨ AI Code Improvement

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-improve-code:
    runs-on: ubuntu-latest
    name: AI-Powered Code Analysis & Improvement
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Analyze Code Quality
        id: analyze
        run: |
          echo "🔍 Analyzing code quality..."
          
          TOTAL_LINES=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          TOTAL_LINES=${TOTAL_LINES:-0}
          CONSOLE_LOGS=$(grep -r 'console.log' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | wc -l || echo 0)
          VAR_USAGE=$(grep -r '\bvar\b' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | wc -l || echo 0)
          TODO_COUNT=$(grep -r 'TODO\|FIXME\|HACK' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | wc -l || echo 0)
          
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
          echo "console_logs=$CONSOLE_LOGS" >> $GITHUB_OUTPUT
          echo "var_usage=$VAR_USAGE" >> $GITHUB_OUTPUT
          echo "todo_count=$TODO_COUNT" >> $GITHUB_OUTPUT
          
          echo "📊 Code Metrics:"
          echo "  - Total Lines: $TOTAL_LINES"
          echo "  - Console.logs: $CONSOLE_LOGS"
          echo "  - Var usage: $VAR_USAGE"
          echo "  - TODOs: $TODO_COUNT"
          
          NEEDS_IMPROVEMENT=false
          if [ "$CONSOLE_LOGS" -gt 5 ] || [ "$VAR_USAGE" -gt 0 ] || [ "$TODO_COUNT" -gt 10 ]; then
            NEEDS_IMPROVEMENT=true
          fi
          echo "needs_improvement=$NEEDS_IMPROVEMENT" >> $GITHUB_OUTPUT
      
      - name: Create Improvement Branch
        if: steps.analyze.outputs.needs_improvement == 'true'
        id: branch
        run: |
          BRANCH="ai-improve-$(date +%Y%m%d-%H%M)"
          git checkout -b $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "🌱 Created branch: $BRANCH"
      
      - name: Generate Code Analysis Report
        if: steps.analyze.outputs.needs_improvement == 'true'
        run: |
          cat > CODE_ANALYSIS.md << 'MDEOF'
          # 📊 Code Analysis Report
          MDEOF
          
          echo "**Generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> CODE_ANALYSIS.md
          echo "" >> CODE_ANALYSIS.md
          echo "## 📈 Metrics" >> CODE_ANALYSIS.md
          echo "- **Total Lines**: ${{ steps.analyze.outputs.total_lines }}" >> CODE_ANALYSIS.md
          echo "- **Console.logs**: ${{ steps.analyze.outputs.console_logs }}" >> CODE_ANALYSIS.md
          echo "- **Var declarations**: ${{ steps.analyze.outputs.var_usage }}" >> CODE_ANALYSIS.md
          echo "- **TODOs/FIXMEs**: ${{ steps.analyze.outputs.todo_count }}" >> CODE_ANALYSIS.md
          
          echo "📝 Generated analysis report"
      
      - name: Create AI Improvement Issue
        if: steps.analyze.outputs.needs_improvement == 'true'
        id: issue
        run: |
          ISSUE_URL=$(gh issue create \
            --title "✨ AI Task: Code Quality Improvements ($(date '+%Y-%m-%d'))" \
            --body "## 🎯 Goal

          Improve code quality across the codebase using AI analysis.

          ### 📊 Current State

          - **Total Lines**: ${{ steps.analyze.outputs.total_lines }}
          - **Console.logs**: ${{ steps.analyze.outputs.console_logs }}
          - **Var usage**: ${{ steps.analyze.outputs.var_usage }}
          - **TODOs**: ${{ steps.analyze.outputs.todo_count }}
          - **Branch**: ${{ steps.branch.outputs.branch }}

          ### ✨ Improvements Needed

          - Remove debug console.log statements
          - Replace 'var' with 'const'/'let'
          - Address TODOs and FIXMEs
          - Add error handling
          - Follow Screeps best practices

          ### 🤖 Instructions for Copilot

          @github-copilot Please improve the codebase following the guidelines in .github/IMPROVEMENT_GUIDE.md

          See CODE_ANALYSIS.md for detailed analysis." \
            --assignee "@me")
          
          ISSUE_NUMBER=$(echo $ISSUE_URL | grep -o '[0-9]*$')
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "✅ Created issue: $ISSUE_URL"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Setup for AI
        if: steps.analyze.outputs.needs_improvement == 'true'
        run: |
          mkdir -p .github
          cat > .github/IMPROVEMENT_GUIDE.md << 'EOF'
          # AI Code Improvement Guide

          ## Priority Order

          1. **Safety First**: Never break existing functionality
          2. **Performance**: Optimize without sacrificing readability
          3. **Maintainability**: Make code easier to understand
          4. **Best Practices**: Follow JavaScript and Screeps standards
          EOF
          
          git config user.name 'AI Improve Bot'
          git config user.email 'ai-improve@screeps.local'
          git add CODE_ANALYSIS.md .github/IMPROVEMENT_GUIDE.md
          git commit -m "✨ Setup: Prepare for AI improvements

          Issue: #${{ steps.issue.outputs.issue_number }}"
          git push origin ${{ steps.branch.outputs.branch }}
      
      - name: Create Draft PR
        if: steps.analyze.outputs.needs_improvement == 'true'
        run: |
          gh pr create \
            --title "✨ [AI] Code Quality Improvements" \
            --body "## ✨ AI-Powered Code Improvements

          This PR contains code quality improvements generated by GitHub Copilot.

          ### 📊 Stats Before

          - Console.logs: ${{ steps.analyze.outputs.console_logs }}
          - Var usage: ${{ steps.analyze.outputs.var_usage }}
          - TODOs: ${{ steps.analyze.outputs.todo_count }}

          ### 🤖 AI Instructions

          @github-copilot Please:
          1. Review CODE_ANALYSIS.md
          2. Follow guidelines in .github/IMPROVEMENT_GUIDE.md
          3. Apply improvements systematically
          4. Maintain all functionality

          Related: #${{ steps.issue.outputs.issue_number }}" \
            --base main \
            --head ${{ steps.branch.outputs.branch }} \
            --draft
          
          echo "✅ Created draft PR for AI improvements"
        env:
          GH_TOKEN: ${{ github.token }}
