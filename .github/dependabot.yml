# Dependabot configuration for automated dependency updates
# Paired with .github/workflows/security-autofix.yml (Grok / feature/security-autofix)

version: 2
updates:
    # Enable version updates for npm
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Asia/Tokyo'
      open-pull-requests-limit: 5
      reviewers:
          - 'tadanobutubutu'
      assignees:
          - 'tadanobutubutu'
      labels:
          - 'dependencies'
          - 'automated'
          - 'security'
      commit-message:
          prefix: 'fix(security)'
          include: 'scope'
      groups:
          security-patches:
              applies-to: security-updates
              patterns:
                  - '*'
              update-types:
                  - 'patch'
                  - 'minor'
      ignore:
          # Re-evaluate intentionally pinned majors here
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']

    # Enable version updates for GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Asia/Tokyo'
      open-pull-requests-limit: 5
      reviewers:
          - 'tadanobutubutu'
      labels:
          - 'github-actions'
          - 'dependencies'
          - 'automated'
      commit-message:
          prefix: '⬆️'
          include: 'scope'
