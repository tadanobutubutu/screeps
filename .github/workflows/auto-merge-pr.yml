name: Auto Merge PRs - Force Penetration (Instant CI)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Batch size per cycle'
        required: false
        default: '100'
      runtime_mins:
        description: 'Max runtime in minutes (continuous loop)'
        required: false
        default: '240'
      push_every:
        description: 'Push commits every N merges'
        required: false
        default: '10'

concurrency:
  group: auto-merge-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  force-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Force Merge PRs (Ultra-Fast Continuous Loop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          BATCH_LIMIT: ${{ inputs.batch_limit || '100' }}
          RUNTIME_MINS: ${{ inputs.runtime_mins || '240' }}
          PUSH_EVERY: ${{ inputs.push_every || '10' }}
        run: |
          echo "Starting Ultra-Fast Continuous Merge: Batch=$BATCH_LIMIT, PushEvery=$PUSH_EVERY, Runtime=${RUNTIME_MINS}m"
          python3 scripts/force_merge_pr.py --batch "$BATCH_LIMIT" --push-every "$PUSH_EVERY" --runtime "$RUNTIME_MINS" || true

      - name: Self-Chaining Trigger (Ensure Continuous Runner)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(gh pr list --state open --limit 1 --json number --jq 'length' || echo "0")
          if [ "$REMAINING" -gt 0 ]; then
            echo "🚀 Open PRs still remain! Triggering next workflow run to keep runner active..."
            gh workflow run auto-merge-pr.yml || true
          else
            echo "🎉 All PRs are merged! Repository is 100% clean!"
          fi
