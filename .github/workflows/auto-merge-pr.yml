name: Auto Merge PRs - GraphQL Ultimate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  graphql-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GraphQL Auto Merge Process
        env:
          # 個人のPATは一切使わず、標準の GITHUB_TOKEN のみを使用します
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "🚀 Starting GraphQL-based Auto Merge Process..."
          
          # 1. オープンなPR一覧を取得するGraphQLクエリ
          PR_LIST_QUERY='
          query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              pullRequests(states: OPEN, first: 100) {
                nodes {
                  id
                  number
                  isDraft
                  mergeable
                  author {
                    login
                  }
                }
              }
            }
          }'
          
          # 取得実行
          PR_DATA=$(gh api graphql -f query="$PR_LIST_QUERY" -f owner="$REPO_OWNER" -f repo="$REPO_NAME")
          
          # PRがない場合は終了
          NODE_COUNT=$(echo "$PR_DATA" | jq '.data.repository.pullRequests.nodes | length')
          if [ "$NODE_COUNT" -eq 0 ]; then
            echo "✨ No open PRs found."
            exit 0
          fi
          
          echo "$PR_DATA" | jq -c '.data.repository.pullRequests.nodes[]' | while read -r pr; do
            PR_ID=$(echo "$pr" | jq -r '.id')
            PR_NO=$(echo "$pr" | jq -r '.number')
            IS_DRAFT=$(echo "$pr" | jq -r '.isDraft')
            MERGEABLE=$(echo "$pr" | jq -r '.mergeable')
            AUTHOR=$(echo "$pr" | jq -r '.author.login')
            
            echo "----------------------------------------"
            echo "🔍 Processing PR #$PR_NO by $AUTHOR (Mergeable: $MERGEABLE, Draft: $IS_DRAFT)"
            
            # 2. Draft状態ならGraphQLで解除(Ready For Review)する
            if [ "$IS_DRAFT" = "true" ]; then
              echo "📝 Converting Draft PR #$PR_NO to Ready for Review..."
              gh api graphql -f query='
                mutation($id: ID!) {
                  markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                    clientMutationId
                  }
                }' -f id="$PR_ID" || echo "⚠️ Failed to convert Draft."
              sleep 2
            fi
            
            # 3. GraphQLで強制マージ (Squash)
            # コンフリクトしていない場合のみ実行
            if [ "$MERGEABLE" != "CONFLICTING" ]; then
              echo "⚡ Attempting to Squash Merge PR #$PR_NO..."
              if gh api graphql -f query='
                mutation($id: ID!) {
                  mergePullRequest(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) { clientMutationId }
                }' -f id="$PR_ID"; then
                echo "✅ Successfully merged PR #$PR_NO!"
                
                # ブランチ削除
                gh pr close "$PR_NO" --delete-branch || true
              else
                echo "❌ Failed to merge PR #$PR_NO."
              fi
            else
              echo "⚠️ PR #$PR_NO has conflicts. Skipping merge."
            fi
          done
