name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const config = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/labeler.yml'
            });
            const yaml = require('js-yaml');
            const decoded = Buffer.from(config.data.content, 'base64').toString();
            const labeler = yaml.load(decoded);
            const files = (await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: number
            })).data.map(f => f.filename);
            for (const [label, patterns] of Object.entries(labeler)) {
              const match = patterns.some(p => files.some(f => f.includes(p)));
              if (match) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [label]
                });
              }
            }
