name: Emergency API Restore

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for emergency restore'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore API
        run: npm run api:restore
        env:
          REASON: ${{ inputs.reason }}
