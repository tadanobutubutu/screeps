name: AI Conflict Resolver (Ultimate Resilience)

on:
  pull_request:
    types: [synchronize, opened, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
        run: |
          echo "🤖 Starting Resilient AI Conflict Resolution..."
          
          # 1. Fetch PRs
          PR_DATA=$(gh api graphql -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){pullRequests(states:OPEN,first:20){nodes{number,headRefName,baseRefName}}}}' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}")
          
          echo "$PR_DATA" | jq -c '.data.repository.pullRequests.nodes[]' | while read -r pr; do
            PR_NO=$(echo "$pr" | jq -r '.number')
            HEAD=$(echo "$pr" | jq -r '.headRefName')
            BASE=$(echo "$pr" | jq -r '.baseRefName')
            
            echo "--- Checking PR #$PR_NO ---"
            git checkout "$HEAD"
            git config user.name "AI Conflict Resolver"
            git config user.email "ai@screeps.local"
            
            git fetch origin "$BASE"
            if git merge "origin/$BASE" --no-edit; then
              echo "✅ Auto-merge ok."
              git push origin "$HEAD" || true
              continue
            fi
            
            FILES=$(git diff --name-only --diff-filter=U)
            for FILE in $FILES; do
              echo "🛠️ Resolving $FILE..."
              CONTENT=$(cat "$FILE")
              PROMPT="Resolve merge conflicts in $FILE. Return ONLY resolved code. No markers, no backticks, no talk. Code:\n$CONTENT"
              
              RESOLVED=""
              
              # Strategy 1: Gemini Direct (v1)
              if [ -n "$GEMINI_API_KEY" ] && [ "$RESOLVED" = "" ]; then
                echo "☁️ Calling Gemini Direct (v1)..."
                RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "{ \"contents\": [{\"parts\": [{\"text\": $(jq -Rs . <<< "$PROMPT")}]}] }")
                RESOLVED=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")
              fi
              
              # Strategy 2: OpenRouter (Gemma 2 Free)
              if [ -n "$OPENROUTER_TOKEN" ] && [ "$RESOLVED" = "" ]; then
                echo "☁️ Calling OpenRouter (Gemma 2 Free)..."
                RES=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                  -H "Authorization: Bearer $OPENROUTER_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg p "$PROMPT" '{model: "google/gemma-2-9b-it:free", messages: [{role: "user", content: $p}]}')")
                RESOLVED=$(echo "$RES" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
              fi
              
              # Strategy 3: Pollinations AI (NO KEY)
              if [ "$RESOLVED" = "" ] || [ "$RESOLVED" = "null" ]; then
                echo "☁️ Calling Pollinations AI (No Key)..."
                # URL encode the prompt
                RESOLVED=$(curl -s "https://text.pollinations.ai/$(jq -Rr @uri <<< "$PROMPT")?model=openai" || echo "")
              fi

              # Strategy 4: Fallback to 'ours' to clear markers
              if [ "$RESOLVED" = "" ] || [ "$RESOLVED" = "null" ] || [[ "$RESOLVED" == *"<!DOCTYPE html>"* ]]; then
                echo "⚠️ AI resolution failed or returned error. Falling back to 'ours' version."
                git checkout --ours "$FILE"
                git add "$FILE"
              else
                echo "$RESOLVED" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```javascript/d' | sed '/^```js/d' > "$FILE"
                git add "$FILE"
                echo "✅ $FILE resolved via AI."
              fi
            done
            
            if git commit -m "chore: Auto-resolve conflicts via AI"; then
              git push origin "$HEAD"
              echo "🚀 Pushed resolution for PR #$PR_NO"
            else
              echo "ℹ️ No changes needed for PR #$PR_NO"
            fi
          done
