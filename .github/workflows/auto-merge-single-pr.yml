name: Auto Merge PR on CI completion

# CI が完了した時点で、open PR 全体を同じゲートで判定する（sweep）。
# PR のコードは実行しない。判定は既定ブランチのスクリプトだけで行う。
# 注意: GitHub は Actions が作成した check suite では check_suite を起動しない。
# その場合の反映は定期 sweep（auto-merge-pr.yml）に任される。
# sweep 方式にしているのは、同時に走った複数の完了イベントを
# concurrency で捨てても、最後の実行が全 PR を再判定して取りこぼさないため。
on:
  check_suite:
    types: [completed]

# auto-merge-pr.yml と同じグループにして、マージを 1 つずつ直列に実行する
concurrency:
  group: auto-merge-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # statusCheckRollup（CI の結果）を読むのに必要
  checks: read
  statuses: read

jobs:
  gate:
    if: >-
      github.event.check_suite.conclusion == 'success' &&
      toJSON(github.event.check_suite.pull_requests) != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          # 既定ブランチのゲートだけを使う（既定ブランチ名は main に固定）
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gated sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/force_merge_pr.py --batch 100
