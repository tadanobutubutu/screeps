3. Basic knowledge of JavaScript

## Setup

### 1. GitHub Connection

1. Go to [Screeps.com](https://screeps.com)
2. Navigate to Account Settings → Git
3. Click "Connect to GitHub"
4. Select repository: `tadanobutubutu/screeps`
5. Choose branch: `main`
