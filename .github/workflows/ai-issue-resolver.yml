name: AI Issue Resolver (Ultimate Resilience)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    # 自分（ボット）のコメントや特定のラベルがない場合はスキップ
    if: github.event.issue.pull_request == null && (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ai-solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AI Solve Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Starting AI Issue Resolution Process..."
          
          # 1. Issueの情報と全コメントを取得
          ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body,comments)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          COMMENTS=$(echo "$ISSUE_DATA" | jq -r '.comments[].body')
          
          # 2. コードベースの概要を取得（ファイル一覧）
          FILE_TREE=$(find . -maxdepth 2 -not -path '*/.*')
          
          # 3. AIプロンプトの構築
          PROMPT="You are an expert AI software engineer. 
          Solve the following GitHub Issue in the current repository.
          
          Issue Title: $TITLE
          Issue Body: $BODY
          Additional Comments: $COMMENTS
          
          Current File Tree:
          $FILE_TREE
          
          Task:
          1. Analyze the issue.
          2. Propose changes to solve it.
          3. Return a JSON array of objects, each with 'path' (file path) and 'content' (FULL new content of the file).
          
          Example Output Format:
          [
            { \"path\": \"src/example.js\", \"content\": \"... full content ...\" }
          ]
          
          Return ONLY the JSON array. No explanations, no backticks."

          RESOLVED_JSON=""
          
          # --- AI Providers (Resilient Fallback) ---
          # Strategy 1: Gemini Direct
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "☁️ Calling Gemini Direct..."
            RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{ \"contents\": [{\"parts\": [{\"text\": $(jq -Rs . <<< "$PROMPT")}]}] }")
            RESOLVED_JSON=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")
          fi
          
          # Strategy 2: OpenRouter (Claude 3.5 Sonnet)
          if [ -z "$RESOLVED_JSON" ] || [ "$RESOLVED_JSON" = "null" ] && [ -n "$OPENROUTER_TOKEN" ]; then
            echo "☁️ Calling OpenRouter..."
            RES=$(curl -s https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$PROMPT" '{model: "anthropic/claude-3.5-sonnet", messages: [{role: "user", content: $p}]}')")
            RESOLVED_JSON=$(echo "$RES" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
          fi

          # Strategy 3: Pollinations AI (FREE)
          if [ -z "$RESOLVED_JSON" ] || [ "$RESOLVED_JSON" = "null" ]; then
            echo "☁️ Calling Pollinations AI (Free)..."
            # Use reliable POST with model selection
            RESOLVED_JSON=$(curl -s -X POST "https://text.pollinations.ai/" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$PROMPT" '{messages: [{role: "user", content: $p}], model: "openai"}')")
          fi
          
          echo "📝 RAW AI Response: $RESOLVED_JSON"
          
          # JSONのクリーンアップ
          CLEAN_JSON=$(echo "$RESOLVED_JSON" | sed '1{/^```/d;};${/^```/d;}' | sed '/^```json/d' | sed '/^```/d')
          echo "📝 CLEANED AI JSON: $CLEAN_JSON"
          
          # 4. 変更の適用
          if echo "$CLEAN_JSON" | jq -e '. | is_array' > /dev/null 2>&1; then
            BRANCH_NAME="ai-solve-issue-$ISSUE_NUMBER"
            git checkout -b "$BRANCH_NAME"
            
            echo "$CLEAN_JSON" | jq -c '.[]' | while read -r change; do
              PATH_TO_FILE=$(echo "$change" | jq -r '.path')
              NEW_CONTENT=$(echo "$change" | jq -r '.content')
              
              mkdir -p "$(dirname "$PATH_TO_FILE")"
              echo "$NEW_CONTENT" > "$PATH_TO_FILE"
              echo "✅ Applied changes to $PATH_TO_FILE"
            done
            
            # 5. コミットとPR作成
            git config user.name "AI Issue Resolver"
            git config user.email "ai-resolver@screeps.local"
            git add .
            git commit -m "fix: AI-generated solution for Issue #$ISSUE_NUMBER"
            git push origin "$BRANCH_NAME" --force
            
            gh pr create --title "AI Solution for Issue #$ISSUE_NUMBER" \
                         --body "This PR was automatically generated by AI to solve Issue #$ISSUE_NUMBER. 
                         Closes #$ISSUE_NUMBER" \
                         --base main --head "$BRANCH_NAME"
            
            gh issue comment $ISSUE_NUMBER --body "🤖 AI has generated a solution and created a PR. This issue will be closed automatically when the PR is merged."
          else
            echo "❌ AI failed to provide a valid JSON solution."
            gh issue comment $ISSUE_NUMBER --body "🤖 AI analysis complete: Could not generate a valid code fix for this issue automatically. Please check the logs."
          fi
