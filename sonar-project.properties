# SonarCloud project configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=tadanobutubutu_screeps
sonar.organization=tadanobutubutu

# Project metadata
sonar.projectName=screeps
sonar.projectVersion=1.0

# Source settings - only scan the dummy placeholder file
sonar.sources=sonar-scan-target

# Exclude nothing inside sonar-scan-target (it's already isolated)
# All real source files are NOT in sonar.sources, so they're ignored entirely
sonar.exclusions=

# Python version
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8
