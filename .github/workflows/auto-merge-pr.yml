name: Auto Merge PRs (gated sweep)

# 定期的に open PR を判定し、条件を満たしたものだけを自動マージする。
# 判定の中身は scripts/force_merge_pr.py を参照。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: '判定のみ行い、マージやラベル付けをしない'
        required: false
        type: boolean
        default: false

# auto-merge-single-pr.yml と同じグループにして、マージを 1 つずつ直列に実行する
concurrency:
  group: auto-merge-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gated sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 scripts/force_merge_pr.py --batch 30
