name: 🤖 Force Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize]
  check_run:
    types: [completed]
  status:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}" --repo "${{ github.repository }}" || echo "Could not enable auto-merge"
