        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('.sentinel/behavior-protection.json','utf8')); const s=c.server||{}; const out=(k,v)=>process.stdout.write(k+'='+String(v||'')+'\n'); out('BASE_URL', c.baseUrl); out('BUILD_CMD', s.buildCommand); out('START_CMD', s.startCommand); out('WAIT_URL', s.waitOnUrl||c.baseUrl);" >> "$GITHUB_OUTPUT"
      - name: Build app (Behavior Protection)
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        run: ${{ steps.bp.outputs.BUILD_CMD }}
      - name: Start app server (Behavior Protection)
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          (${{ steps.bp.outputs.START_CMD }}) &
      - name: Wait for server
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          url="${{ steps.bp.outputs.WAIT_URL }}"
          for i in $(seq 1 60); do
            if curl -fsS "$url" >/dev/null 2>&1; then
              echo "Server is up: $url"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready: $url" >&2
          exit 1
      - name: Run Behavior Protection smoke checks
        id: bp_run
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        env:
          SENTINEL_SHIFT_USER: ${{ secrets.SENTINEL_SHIFT_USER }}
          SENTINEL_SHIFT_PASSWORD: ${{ secrets.SENTINEL_SHIFT_PASSWORD }}
        run: |
          mkdir -p .sentinel
          set +e
          target_dir=""
          if [ -d "tests/e2e/behavior-protection" ]; then
            target_dir="tests/e2e/behavior-protection"
          elif [ -d "tests/behavior-protection" ]; then
            target_dir="tests/behavior-protection"
          else
            echo "Behavior Protection test directory not found." >&2
            exit 1
          fi
          npx playwright test -c playwright.behavior.config.ts "$target_dir"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Finalize Behavior Protection result
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          final="${{ steps.bp_run.outputs.exit_code }}"
          echo "Final exit code: $final"
          if [ "$final" != "0" ]; then
            exit 1
          fi
      - name: Emit Behavior Protection result payload
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' && always() }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.sentinel/behavior-protection-results.json';
          const payloadPath = '.sentinel/behavior-protection-result-payload.txt';
          const markerBegin = '<!-- SENTINEL_BEHAVIOR_PROTECTION_RESULT_BEGIN -->';
          const markerEnd = '<!-- SENTINEL_BEHAVIOR_PROTECTION_RESULT_END -->';
          const safeTrim = (s, n) => (typeof s === 'string' && s.length > n ? s.slice(0, n - 1) + '…' : s);
          const extractKey = (title) => {
            const m = String(title || '').match(/\bgtc_[a-z0-9]+\b/i);
            return m ? String(m[0]) : null;
          };
          const flattenSpecs = (suite, out) => {
            if (!suite || typeof suite !== 'object') return;
            if (Array.isArray(suite.specs)) out.push(...suite.specs);
            if (Array.isArray(suite.suites)) for (const s of suite.suites) flattenSpecs(s, out);
          };
          fs.mkdirSync('.sentinel', { recursive: true });
          let report = null;
          try { report = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const specs = [];
          if (report && Array.isArray(report.suites)) for (const s of report.suites) flattenSpecs(s, specs);
          const cases = specs.map((spec) => {
            const title = spec && typeof spec.title === 'string' ? spec.title : '';
            const key = extractKey(title);
            const tests = Array.isArray(spec.tests) ? spec.tests : [];
            const results = tests.flatMap((t) => Array.isArray(t.results) ? t.results : []);
            const statuses = results.map((r) => String(r.status || '')).filter(Boolean);
            const status = statuses.includes('passed') ? 'passed' : statuses.includes('skipped') ? 'skipped' : 'failed';
            const err = results.find((r) => r && r.error)?.error;
            const failureSummary = err ? safeTrim(String(err.message || err.value || 'Behavior drift'), 240) : null;
            return { descriptorKey: key, title, status, ...(failureSummary ? { failureSummary } : {}) };
          });
          const payload = { version: 1, kind: 'behavior_protection', runAt: new Date().toISOString(), cases };
          const body = [markerBegin, JSON.stringify(payload), markerEnd].join('\n');
          fs.writeFileSync(payloadPath, body + '\n');
          console.log(body);
          NODE
      - name: Upload Behavior Protection artifacts
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-behavior-protection
          path: |
            .sentinel/behavior-protection-results.json
            .sentinel/behavior-protection-result-payload.txt
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Post Behavior Protection results comment
        if: ${{ steps.bp_enabled.outputs.enabled == 'true' && always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payloadPath = '.sentinel/behavior-protection-result-payload.txt';
            const markerBegin = '<!-- SENTINEL_BEHAVIOR_PROTECTION_RESULT_BEGIN -->';
            const body = fs.readFileSync(payloadPath, 'utf8').trim();
            if (!body.includes(markerBegin)) {
              core.warning('Behavior Protection result payload was not generated; skipping PR comment update.');
              return;
            }
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(markerBegin));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
