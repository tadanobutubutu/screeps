name: 📊 Coverage Report

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 毎日 10:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run Jest coverage
        run: npx jest --coverage --coverageReporters=lcov json-summary --passWithNoTests
        continue-on-error: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Create Issue for low coverage
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverageData = null;
            try {
              const summary = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
              coverageData = JSON.parse(summary);
            } catch (e) { return; }
            const total = coverageData.total;
            const lowCoverageFiles = [];
            for (const [file, data] of Object.entries(coverageData)) {
              if (file === 'total') continue;
              if (data.lines.pct < 50) {
                lowCoverageFiles.push(`- \`${file}\`: Lines ${data.lines.pct}%`);
              }
            }
            if (lowCoverageFiles.length === 0) return;
            const issueTitle = `📊 Codecov: カバレッジが低いファイル (${lowCoverageFiles.length}件)`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coverage'
            });
            if (existing.data.some(i => i.title === issueTitle)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: `## 📊 Coverage Report\n\n**Total**: ${total.lines.pct}%\n\n### ⚠️ Low Coverage Files\n${lowCoverageFiles.join('\n')}\n\n---\n**Auto-generated**`,
              labels: ['coverage', 'enhancement', 'automated']
            });
